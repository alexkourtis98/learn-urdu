<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urdu Exercises — اردو مشقیں</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.6;padding:0 0 60px}
h1{text-align:center;padding:30px 20px 10px;font-size:2em;color:#f5f5f5;letter-spacing:1px}
.subtitle{text-align:center;color:#888;font-size:.95em;margin-bottom:20px}
#scorebar{position:sticky;top:0;z-index:100;background:#16213e;border-bottom:2px solid #c85028;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-size:1.05em}
#scorebar .score{color:#c85028;font-weight:700;font-size:1.2em}
#scorebar .pct{color:#888;font-size:.9em;margin-left:10px}
#scorebar button{background:#c85028;color:#fff;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;font-size:.9em;margin-left:8px}
#scorebar button:hover{background:#e06030}
#saveStatus{margin-left:12px;font-size:.82em;color:#2ecc71;opacity:0;transition:opacity .4s}
#saveStatus.show{opacity:1}
.container{max-width:900px;margin:0 auto;padding:0 20px}
.exercise{background:#16213e;border-radius:10px;margin:20px 0;overflow:hidden;border:1px solid #233}
.exercise-header{background:#0f3460;padding:14px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.exercise-header:hover{background:#1a4a80}
.exercise-header h2{font-size:1.1em;color:#f5f5f5;margin:0}
.exercise-header .arrow{color:#c85028;font-size:1.2em;transition:transform .2s}
.exercise-header .arrow.open{transform:rotate(90deg)}
.exercise-body{padding:20px;display:none}
.exercise-body.open{display:block}
.instruction{color:#aaa;font-size:.9em;margin-bottom:14px;font-style:italic}
.rule-box{background:#1a1a2e;border-left:3px solid #c85028;padding:8px 14px;margin:10px 0;font-size:.88em;color:#bbb}
table{width:100%;border-collapse:collapse;margin:10px 0}
th{background:#0f3460;color:#ddd;padding:8px 10px;text-align:left;font-size:.85em;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid #233;font-size:.9em;vertical-align:middle}
tr:nth-child(even) td{background:rgba(255,255,255,.02)}
td.num{color:#666;width:40px;text-align:center}
input[type="text"]{background:#1a1a2e;border:2px solid #333;color:#e0e0e0;padding:6px 10px;border-radius:4px;font-size:.9em;width:100%;transition:border-color .2s,background .2s}
input[type="text"]:focus{border-color:#c85028;outline:none}
input[type="text"].correct{border-color:#2ecc71;background:rgba(46,204,113,.1);color:#2ecc71}
input[type="text"].wrong{border-color:#e74c3c;background:rgba(231,76,60,.1);color:#e74c3c}
input[type="text"].answered{opacity:.8;cursor:default}
.answer-reveal{color:#c85028;font-size:.82em;margin-top:3px;display:none}
.answer-reveal.show{display:block}
.hint-text{color:#888;font-size:.82em;margin-top:2px;display:none;font-style:italic}
.hint-text.show{display:block}
.checkmark{color:#2ecc71;margin-left:6px;font-weight:700}
.ex-cell{position:relative}
textarea{background:#1a1a2e;border:2px solid #333;color:#e0e0e0;padding:10px;border-radius:4px;font-size:.9em;width:100%;min-height:120px;resize:vertical;font-family:inherit}
textarea:focus{border-color:#c85028;outline:none}
.model-btn{background:#c85028;color:#fff;border:none;padding:8px 18px;border-radius:4px;cursor:pointer;font-size:.9em;margin-top:10px}
.model-btn:hover{background:#e06030}
.model-answer{background:#1a1a2e;border-left:3px solid #c85028;padding:12px 16px;margin-top:12px;font-size:.9em;color:#bbb;display:none;line-height:1.7}
.model-answer.show{display:block}
.dialogue{line-height:2.2;font-size:.95em}
.dialogue .speaker{color:#c85028;font-weight:700}
.dialogue input[type="text"]{display:inline-block;width:160px;margin:0 4px;vertical-align:middle}
.dialogue .hint{color:#666;font-size:.82em;font-style:italic}
.mc-group{margin:16px 0}
.mc-q{font-weight:600;margin-bottom:8px;color:#f0f0f0}
.mc-option{display:block;padding:8px 14px;margin:4px 0;border-radius:4px;cursor:pointer;border:2px solid #333;transition:all .2s;font-size:.9em}
.mc-option:hover{border-color:#c85028;background:rgba(200,80,40,.08)}
.mc-option input[type="radio"]{margin-right:8px;accent-color:#c85028}
.mc-option.correct-choice{border-color:#2ecc71;background:rgba(46,204,113,.12);color:#2ecc71}
.mc-option.wrong-choice{border-color:#e74c3c;background:rgba(231,76,60,.08);color:#e74c3c}
.mc-option.reveal-correct{border-color:#2ecc71;background:rgba(46,204,113,.06)}
.mc-option.locked{pointer-events:none;opacity:.85}
.practice-link{color:#c85028;font-size:1.1em;text-decoration:none;padding:2px 8px;border:1px solid #c85028;border-radius:4px;transition:background .2s,color .2s;flex-shrink:0}
.practice-link:hover{background:#c85028;color:#fff}
.practice-badge{font-size:.75em;color:#888;background:rgba(200,80,40,.15);padding:2px 8px;border-radius:10px;display:none}
.practice-badge.has-progress{display:inline-block}
.practice-badge.complete{background:rgba(46,204,113,.15);color:#2ecc71}
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid #c85028;color:#c85028;font-size:.75em;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .2s;font-style:italic;font-family:Georgia,serif}
.info-icon:hover{background:#c85028;color:#fff}
.theory-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.theory-overlay.show{display:flex}
.theory-content{background:#16213e;border:1px solid #c85028;border-radius:10px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;position:relative;color:#e0e0e0;font-size:.92em;line-height:1.6}
.theory-content h3{color:#f5f5f5;margin:0 0 12px;font-size:1.1em}
.theory-content .close-theory{position:absolute;top:10px;right:14px;color:#888;cursor:pointer;font-size:1.3em;line-height:1}
.theory-content .close-theory:hover{color:#c85028}
.theory-content table{width:100%;margin:8px 0}
.theory-content th{background:#0f3460;padding:6px 10px;font-size:.85em;text-align:left}
.theory-content td{padding:5px 10px;border-bottom:1px solid #233;font-size:.88em}
.theory-content .rule{color:#c85028;font-weight:600}
.theory-content p{margin:6px 0}
.theory-content ul{margin:6px 0;padding-left:18px}
.theory-content li{margin:3px 0;font-size:.9em}
.urdu{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Nafees Nastaleeq',serif;direction:rtl;unicode-bidi:bidi-override;font-size:1.05em}
@media(max-width:600px){
  h1{font-size:1.4em}
  .exercise-header h2{font-size:.95em}
  td,th{padding:6px;font-size:.82em}
  input[type="text"]{font-size:.85em;padding:5px 8px}
  .dialogue input[type="text"]{width:120px}
}

.conj-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:none;align-items:center;justify-content:center}
.conj-overlay.show{display:flex}
.conj-content{background:#16213e;border-radius:12px;width:95vw;max-width:960px;height:90vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.conj-close{position:absolute;top:10px;right:14px;background:none;border:none;color:#e0e0e0;font-size:24px;cursor:pointer;z-index:2}
.conj-close:hover{color:#fff}
.conj-header{padding:16px 20px 10px;border-bottom:1px solid #0f3460}
.conj-header h2{margin:0;color:#e0e0e0;font-size:1.3em}
.conj-layout{display:flex;flex:1;overflow:hidden}
.conj-sidebar{width:240px;border-right:1px solid #0f3460;overflow-y:auto;padding:10px;flex-shrink:0}
.conj-search{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #0f3460;background:#1a1a2e;color:#e0e0e0;font-size:.9em;margin-bottom:10px;box-sizing:border-box}
.conj-search::placeholder{color:#666}
.conj-search:focus{outline:none;border-color:#c85028}
.conj-cat-label{color:#c85028;font-size:.7em;text-transform:uppercase;letter-spacing:1px;margin:12px 0 4px;font-weight:700}
.conj-cat-label:first-child{margin-top:0}
.conj-verb-btn{display:block;width:100%;text-align:left;padding:6px 10px;border:none;border-radius:4px;background:transparent;color:#e0e0e0;cursor:pointer;font-size:.85em;margin:1px 0}
.conj-verb-btn:hover{background:#0f3460}
.conj-verb-btn.active{background:#c85028;color:#fff}
.conj-verb-btn .conj-verb-en{color:#888;font-size:.8em;margin-left:4px}
.conj-main{flex:1;overflow-y:auto;padding:20px}
.conj-main-empty{color:#888;text-align:center;margin-top:80px;font-size:1.1em}
.conj-verb-title{color:#e0e0e0;font-size:1.4em;margin:0 0 4px}
.conj-verb-meta{color:#aaa;font-size:.85em;margin-bottom:16px}
.conj-verb-meta span{margin-right:16px}
.conj-verb-meta b{color:#c85028}
.conj-tenses-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.conj-tense-card{background:#1a1a2e;border-radius:8px;padding:12px;border:1px solid #0f3460}
.conj-tense-card h4{margin:0 0 8px;color:#c85028;font-size:.85em;text-transform:uppercase;letter-spacing:.5px}
.conj-tense-table{width:100%;border-collapse:collapse}
.conj-tense-table td{padding:3px 6px;font-size:.82em;color:#e0e0e0;border-bottom:1px solid rgba(15,52,96,.5)}
.conj-tense-table td:first-child{color:#888;width:40%}
.conj-tense-table tr:last-child td{border-bottom:none}
.conj-tabs{display:flex;border-bottom:2px solid #0f3460;padding:0 20px;background:#16213e}
.conj-tab{padding:10px 20px;cursor:pointer;color:#888;font-size:.9em;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;user-select:none}
.conj-tab:hover{color:#e0e0e0}
.conj-tab.active{color:#c85028;border-bottom-color:#c85028;font-weight:600}
.conj-tab-content{display:none;flex:1;overflow:hidden}
.conj-tab-content.active{display:flex}
.conj-tab-content.active.conj-tab-single{display:block;overflow-y:auto;padding:20px}
.conj-tense-group-label{grid-column:1/-1;color:#c85028;font-size:.75em;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px solid rgba(200,80,40,.3)}
.conj-tense-group-label:first-child{margin-top:0}
.conj-tense-info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid #c85028;color:#c85028;font-size:.65em;font-weight:700;cursor:pointer;margin-left:6px;transition:all .2s;font-style:italic;font-family:Georgia,serif;vertical-align:middle}
.conj-tense-info:hover{background:#c85028;color:#fff}
.drill-area{padding:0}
.drill-menu{text-align:center}
.drill-menu h3{color:#e0e0e0;margin-bottom:16px}
.drill-menu-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:700px;margin:0 auto}
.drill-menu-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:10px;padding:20px;cursor:pointer;transition:all .2s;text-align:center}
.drill-menu-card:hover{border-color:#c85028;transform:translateY(-2px)}
.drill-menu-icon{font-size:2em;margin-bottom:8px}
.drill-menu-title{color:#e0e0e0;font-weight:600;font-size:1em;margin-bottom:6px}
.drill-menu-desc{color:#888;font-size:.8em;line-height:1.4}
.drill-stats-mini{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:12px 0;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.drill-stats-mini span{background:#1a1a2e;padding:4px 12px;border-radius:4px;color:#888;font-size:.85em}
.drill-progress{color:#888;font-size:.85em;margin-bottom:8px}
.drill-streak{color:#c85028;font-size:.85em;margin-bottom:12px}
.drill-question-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:10px;padding:24px;max-width:500px;margin:0 auto;text-align:center}
.drill-verb{font-size:1.4em;color:#e0e0e0;font-weight:700}
.drill-verb-en{color:#888;font-size:.7em;font-weight:400}
.drill-tense{color:#c85028;font-size:.9em;margin:6px 0}
.drill-person{color:#e0e0e0;font-size:1.2em;margin:12px 0;font-weight:600}
.drill-gender-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.75em;font-weight:700;margin:6px 0}
.drill-gender-m{background:rgba(52,152,219,.2);color:#3498db;border:1px solid rgba(52,152,219,.4)}
.drill-gender-f{background:rgba(231,76,60,.2);color:#e74c3c;border:1px solid rgba(231,76,60,.4)}
.drill-input-row{display:flex;gap:8px;justify-content:center;margin:16px 0 8px}
.drill-input{background:#16213e;border:2px solid #333;color:#e0e0e0;padding:10px 16px;border-radius:6px;font-size:1em;width:250px;text-align:center}
.drill-input:focus{border-color:#c85028;outline:none}
.drill-input.correct{border-color:#2ecc71;background:rgba(46,204,113,.1);color:#2ecc71}
.drill-input.wrong{border-color:#e74c3c;background:rgba(231,76,60,.1);color:#e74c3c}
.drill-input.shown{border-color:#f39c12;color:#f39c12}
.drill-check-btn{background:#c85028;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:.95em}
.drill-check-btn:hover{background:#e0612b}
.drill-feedback{margin-top:12px;font-size:.95em;min-height:24px}
.drill-correct{color:#2ecc71;font-weight:600}
.drill-wrong{color:#e74c3c;font-weight:600}
.drill-shown{color:#f39c12}
.drill-xp{color:#f1c40f;font-weight:600;margin-left:8px}
.drill-speed-bonus{color:#f1c40f;font-style:italic}
.drill-time{color:#888;font-size:.85em}
.drill-show-btn{background:transparent;border:1px solid #555;color:#888;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:.8em;margin-top:8px}
.drill-show-btn:hover{border-color:#888;color:#e0e0e0}
.drill-na{color:#555}
.drill-action-btn{background:#c85028;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}
.drill-action-btn:hover{background:#e0612b}
.drill-action-btn.drill-action-secondary{background:transparent;border:1px solid #555;color:#888}
.drill-action-btn.drill-action-secondary:hover{border-color:#888;color:#e0e0e0}
.drill-results{text-align:center}
.drill-results h3{color:#e0e0e0;margin-bottom:12px}
.drill-results-score{font-size:2em;color:#c85028;font-weight:700}
.drill-results-time{color:#888;font-size:.9em;margin-bottom:16px}
.drill-results-table{max-width:700px;margin:0 auto 16px}
.drill-results-table th{background:#0f3460}
.drill-row-correct td{background:rgba(46,204,113,.05)}
.drill-row-wrong td{background:rgba(231,76,60,.05)}
.drill-actions{margin-top:16px}
.drill-full-table{max-width:500px;margin:0 auto}
.drill-full-table h3{color:#e0e0e0;margin-bottom:4px}
.drill-ft-table{width:100%}
.drill-ft-table th{background:#0f3460}
.drill-ft-person{color:#888;font-weight:600;width:40%}
.drill-ft-input{background:#1a1a2e;border:2px solid #333;color:#e0e0e0;padding:6px 10px;border-radius:4px;font-size:.9em;width:100%}
.drill-ft-input:focus{border-color:#c85028;outline:none}
.drill-ft-input.correct{border-color:#2ecc71;color:#2ecc71}
.drill-ft-input.wrong{border-color:#e74c3c;color:#e74c3c}
.drill-ft-result{width:30%;font-size:.85em}
.drill-ft-actions{margin-top:16px;text-align:center}
.drill-ft-score{text-align:center;margin-top:16px;color:#e0e0e0}
.drill-selection{max-width:400px;margin:0 auto;text-align:center}
.drill-selection h3{color:#e0e0e0;margin-bottom:12px}
.drill-selection p{color:#888;margin-bottom:16px;font-size:.9em}
.drill-select-row{margin:12px 0;text-align:left}
.drill-select-row label{display:block;color:#888;font-size:.85em;margin-bottom:4px}
.drill-select{width:100%;background:#1a1a2e;border:1px solid #0f3460;color:#e0e0e0;padding:8px 10px;border-radius:6px;font-size:.9em}
.drill-select:focus{outline:none;border-color:#c85028}
.drill-select optgroup{background:#16213e;color:#888;font-style:normal;font-weight:700;font-size:.85rem;padding:4px 0}
.drill-select option{background:#1a1a2e;color:#e0e0e0;padding:4px 8px}
.drill-random{text-align:center}
.drill-random h3{color:#f1c40f}
.drill-random-subtitle{color:#888;font-size:.85em;margin-bottom:16px}
.drill-random-card{border-color:#f1c40f}
.grammar-index{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grammar-topic-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:14px;cursor:pointer;transition:all .2s}
.grammar-topic-card:hover{border-color:#c85028}
.grammar-topic-num{color:#c85028;font-size:.75em;font-weight:700}
.grammar-topic-title{color:#e0e0e0;font-size:.95em;font-weight:600;margin-top:4px}
.grammar-topic-read{color:#2ecc71;font-size:.7em;margin-top:4px}
.grammar-detail{max-width:700px;margin:0 auto}
.grammar-detail h3{color:#e0e0e0;margin-bottom:12px}
.grammar-back{background:transparent;border:1px solid #555;color:#888;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:.85em;margin-bottom:16px}
.grammar-back:hover{border-color:#888;color:#e0e0e0}
.progress-dashboard{max-width:700px;margin:0 auto}
.progress-header{text-align:center;margin-bottom:20px}
.progress-level{font-size:2em;color:#c85028;font-weight:700}
.progress-title-text{color:#888;font-size:1em;margin-top:4px}
.progress-xp-bar{background:#1a1a2e;border-radius:10px;height:20px;margin:12px 0;overflow:hidden;border:1px solid #333}
.progress-xp-fill{background:linear-gradient(90deg,#c85028,#e0612b);height:100%;border-radius:10px;transition:width .4s}
.progress-xp-text{color:#888;font-size:.85em;text-align:center}
.progress-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.progress-stat{background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:12px;text-align:center}
.progress-stat-val{font-size:1.5em;color:#c85028;font-weight:700}
.progress-stat-label{color:#888;font-size:.75em;margin-top:4px}
.badges-section{margin:20px 0}
.badges-section h4{color:#e0e0e0;margin-bottom:12px}
.badges-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.badge-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:10px;text-align:center;transition:all .2s}
.badge-card.earned{border-color:#c85028}
.badge-card.locked{opacity:.4}
.badge-icon{font-size:1.5em}
.badge-name{color:#e0e0e0;font-size:.7em;margin-top:4px;font-weight:600}
.badge-desc{color:#888;font-size:.6em;margin-top:2px}
.heatmap-section{margin:20px 0;overflow-x:auto}
.heatmap-section h4{color:#e0e0e0;margin-bottom:12px}
.heatmap-table{border-collapse:collapse;font-size:.65em;width:100%}
.heatmap-table th{background:#0f3460;color:#ddd;padding:4px 6px;text-align:center;font-weight:600;white-space:nowrap}
.heatmap-table td{padding:4px 6px;text-align:center;border:1px solid #233}
.heatmap-table td.heatmap-verb{text-align:left;color:#888;font-weight:600;white-space:nowrap}
.heatmap-cell{display:inline-block;width:100%;min-width:20px;height:16px;border-radius:3px}
.xp-display{color:#f1c40f;font-size:.85em;font-weight:600;margin-left:12px;cursor:pointer}
.xp-display:hover{color:#f39c12}
.conj-notification{position:fixed;top:20px;right:20px;background:#16213e;border:1px solid #c85028;border-radius:8px;padding:14px 20px;z-index:10001;transform:translateX(120%);transition:transform .4s ease;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.conj-notification.show{transform:translateX(0)}
.conj-notification-levelup{border-color:#f1c40f}
.conj-notification-badge{border-color:#2ecc71}
.conj-notif-title{color:#e0e0e0;font-weight:700;font-size:.95em}
.conj-notif-msg{color:#888;font-size:.82em;margin-top:4px}

  10: '<h3>Common Objects (عام چیزیں)</h3><table><tr><th>Urdu</th><th>Transliteration</th><th>English</th><th>Gender</th></tr><tr><td dir="rtl">کتاب</td><td>Kitaab</td><td>Book</td><td>f.</td></tr><tr><td dir="rtl">قلم</td><td>Qalam</td><td>Pen</td><td>m.</td></tr><tr><td dir="rtl">کرسی</td><td>Kursi</td><td>Chair</td><td>f.</td></tr><tr><td dir="rtl">میز</td><td>Maiz</td><td>Table</td><td>f.</td></tr><tr><td dir="rtl">گھر</td><td>Ghar</td><td>House</td><td>m.</td></tr><tr><td dir="rtl">دروازہ</td><td>Darwaza</td><td>Door</td><td>m.</td></tr><tr><td dir="rtl">کھڑکی</td><td>Khidki</td><td>Window</td><td>f.</td></tr><tr><td dir="rtl">گھڑی</td><td>Ghari</td><td>Clock/Watch</td><td>f.</td></tr></table><p><span class="rule">Gender rules in Urdu:</span></p><ul><li>Most nouns ending in <strong>ا</strong> (a) are masculine: دروازہ (darwaza), کمرہ (kamra)</li><li>Most nouns ending in <strong>ی</strong> (i) are feminine: کرسی (kursi), کھڑکی (khidki)</li><li>Many exceptions exist and must be memorized: کتاب (f.), قلم (m.)</li></ul>',

  11: '<h3>Basic Verbs (بنیادی افعال)</h3><table><tr><th>Urdu Infinitive</th><th>Transliteration</th><th>English</th><th>Verb Stem</th></tr><tr><td dir="rtl">کھانا</td><td>Khana</td><td>To eat</td><td>کھا (kha)</td></tr><tr><td dir="rtl">پینا</td><td>Peena</td><td>To drink</td><td>پی (pee)</td></tr><tr><td dir="rtl">سونا</td><td>Sona</td><td>To sleep</td><td>سو (so)</td></tr><tr><td dir="rtl">جانا</td><td>Jana</td><td>To go</td><td>جا (ja)</td></tr><tr><td dir="rtl">آنا</td><td>Aana</td><td>To come</td><td>آ (aa)</td></tr><tr><td dir="rtl">بیٹھنا</td><td>Baithna</td><td>To sit</td><td>بیٹھ (baith)</td></tr><tr><td dir="rtl">پڑھنا</td><td>Parhna</td><td>To read/study</td><td>پڑھ (parh)</td></tr><tr><td dir="rtl">لکھنا</td><td>Likhna</td><td>To write</td><td>لکھ (likh)</td></tr><tr><td dir="rtl">بولنا</td><td>Bolna</td><td>To speak</td><td>بول (bol)</td></tr></table><p><span class="rule">Infinitive form:</span> All Urdu infinitives end in <strong>نا</strong> (na). Remove نا to get the verb stem.</p><p><span class="rule">Present tense:</span> Stem + تا/تی/تے (ta/ti/te) + ہوں/ہے/ہیں (hoon/hai/hain)</p><ul><li>میں کھاتا ہوں (main khata hoon) = I eat (male)</li><li>میں کھاتی ہوں (main khati hoon) = I eat (female)</li></ul>',

  12: '<h3>Commands / Imperative (احکام)</h3><p><span class="rule">Three levels of formality:</span></p><table><tr><th>Level</th><th>Pronoun</th><th>Pattern</th><th>Example: آنا (to come)</th></tr><tr><td>Very informal</td><td>تو (tu)</td><td>Bare stem</td><td>آ (aa) = come!</td></tr><tr><td>Informal</td><td>تم (tum)</td><td>Stem + و (o)</td><td>آؤ (aao) = come!</td></tr><tr><td>Formal</td><td>آپ (aap)</td><td>Stem + یے/ئیے (iye)</td><td>آئیے (aaiye) = please come!</td></tr></table><p><span class="rule">Examples across formality:</span></p><ul><li>کھانا: کھا (kha) / کھاؤ (khao) / کھائیے (khaiye)</li><li>بیٹھنا: بیٹھ (baith) / بیٹھو (baitho) / بیٹھیے (baithiye)</li><li>سننا: سن (sun) / سنو (suno) / سنیے (suniye)</li></ul><p><span class="rule">Negative command:</span> Add <strong>مت</strong> (mat) before the verb: مت جاؤ (mat jao) = don\'t go!</p>',

  13: '<h3>Food & Drinks (کھانا پینا)</h3><table><tr><th>Urdu</th><th>Transliteration</th><th>English</th><th>Gender</th></tr><tr><td dir="rtl">پانی</td><td>Pani</td><td>Water</td><td>m.</td></tr><tr><td dir="rtl">چائے</td><td>Chai</td><td>Tea</td><td>f.</td></tr><tr><td dir="rtl">دودھ</td><td>Doodh</td><td>Milk</td><td>m.</td></tr><tr><td dir="rtl">چاول</td><td>Chawal</td><td>Rice</td><td>m.</td></tr><tr><td dir="rtl">روٹی</td><td>Roti</td><td>Bread/Roti</td><td>f.</td></tr><tr><td dir="rtl">سیب</td><td>Saib</td><td>Apple</td><td>m.</td></tr><tr><td dir="rtl">کیلا</td><td>Kela</td><td>Banana</td><td>m.</td></tr><tr><td dir="rtl">انڈا</td><td>Anda</td><td>Egg</td><td>m.</td></tr><tr><td dir="rtl">گوشت</td><td>Gosht</td><td>Meat</td><td>m.</td></tr><tr><td dir="rtl">سبزیاں</td><td>Sabziyan</td><td>Vegetables</td><td>f. pl.</td></tr></table><p><span class="rule">Ordering food:</span></p><ul><li>مجھے چائے دیجیے (mujhe chai dijiye) = Please give me tea</li><li>کھانا تیار ہے (khana tayyar hai) = Food is ready</li></ul>',

  14: '<h3>Question Words (سوالیہ الفاظ)</h3><table><tr><th>Urdu</th><th>Transliteration</th><th>English</th><th>Example</th></tr><tr><td dir="rtl">کیا</td><td>Kya</td><td>What</td><td>یہ کیا ہے؟ (Yeh kya hai?)</td></tr><tr><td dir="rtl">کون</td><td>Kaun</td><td>Who</td><td>یہ کون ہے؟ (Yeh kaun hai?)</td></tr><tr><td dir="rtl">کہاں</td><td>Kahan</td><td>Where</td><td>آپ کہاں ہیں؟ (Aap kahan hain?)</td></tr><tr><td dir="rtl">کب</td><td>Kab</td><td>When</td><td>آپ کب آئیں گے؟ (Aap kab aainge?)</td></tr><tr><td dir="rtl">کیوں</td><td>Kyun</td><td>Why</td><td>کیوں نہیں؟ (Kyun nahi?)</td></tr><tr><td dir="rtl">کیسے / کیسی</td><td>Kaise / Kaisi</td><td>How</td><td>آپ کیسے ہیں؟</td></tr><tr><td dir="rtl">کتنا / کتنے</td><td>Kitna / Kitne</td><td>How much/many</td><td>کتنے کا ہے؟ (Kitne ka hai?)</td></tr><tr><td dir="rtl">کون سا</td><td>Kaun sa</td><td>Which</td><td>کون سا رنگ؟ (Kaun sa rang?)</td></tr></table><p><span class="rule">کیا as question marker:</span> کیا at the start of a sentence turns it into a yes/no question: کیا آپ ٹھیک ہیں؟ (Kya aap theek hain?) = Are you fine?</p>',

  15: '<h3>Chahiye Expressions (چاہیے)</h3><p><span class="rule">Structure:</span> Subject (in oblique case) + noun + چاہیے</p><table><tr><th>Subject</th><th>Oblique Form</th><th>Example</th></tr><tr><td>میں (I)</td><td>مجھے (mujhe)</td><td>مجھے پانی چاہیے (I need water)</td></tr><tr><td>تم (you, informal)</td><td>تمہیں (tumhein)</td><td>تمہیں مدد چاہیے (You need help)</td></tr><tr><td>آپ (you, formal)</td><td>آپ کو (aap ko)</td><td>آپ کو آرام چاہیے (You need rest)</td></tr><tr><td>وہ (he/she)</td><td>اسے (use)</td><td>اسے کتاب چاہیے (He/she needs a book)</td></tr><tr><td>ہم (we)</td><td>ہمیں (hamein)</td><td>ہمیں وقت چاہیے (We need time)</td></tr></table><p><span class="rule">Key point:</span> چاہیے does NOT conjugate, it stays the same regardless of subject, gender, or number.</p><p><span class="rule">With verbs:</span> مجھے + infinitive + چاہیے = I should / I need to: مجھے جانا چاہیے (mujhe jana chahiye) = I should go.</p>',

  16: '<h3>Feelings & States (احساسات)</h3><p><span class="rule">Two patterns for expressing feelings:</span></p><p><strong>Pattern 1: Subject + adjective + ہوں/ہے/ہیں</strong></p><table><tr><th>Urdu</th><th>Transliteration</th><th>English</th></tr><tr><td dir="rtl">میں خوش ہوں</td><td>Main khush hoon</td><td>I am happy</td></tr><tr><td dir="rtl">میں اداس ہوں</td><td>Main udaas hoon</td><td>I am sad</td></tr><tr><td dir="rtl">میں ٹھیک ہوں</td><td>Main theek hoon</td><td>I am fine</td></tr><tr><td dir="rtl">میں بیمار ہوں</td><td>Main beemar hoon</td><td>I am sick</td></tr></table><p><strong>Pattern 2: مجھے + noun + لگی/لگ رہی ہے</strong> (physical sensations)</p><table><tr><th>Urdu</th><th>Transliteration</th><th>English</th></tr><tr><td dir="rtl">مجھے بھوک لگی ہے</td><td>Mujhe bhook lagi hai</td><td>I am hungry</td></tr><tr><td dir="rtl">مجھے پیاس لگی ہے</td><td>Mujhe pyas lagi hai</td><td>I am thirsty</td></tr><tr><td dir="rtl">مجھے سردی لگ رہی ہے</td><td>Mujhe sardi lag rahi hai</td><td>I am cold</td></tr><tr><td dir="rtl">مجھے ڈر لگ رہا ہے</td><td>Mujhe dar lag raha hai</td><td>I am scared</td></tr></table><p><span class="rule">Note:</span> Like Italian\'s "ho fame" (I have hunger), Urdu uses a dative construction: "مجھے بھوک لگی ہے" literally = "to me hunger has attached."</p>',

  17: '<h3>Translation Tips: English to Urdu</h3><p><span class="rule">Word order:</span> Urdu uses SOV (Subject-Object-Verb), unlike English SVO:</p><ul><li>English: I eat food. (SVO)</li><li>Urdu: میں کھانا کھاتا ہوں (Main khana khata hoon) = I food eat. (SOV)</li></ul><p><span class="rule">Key differences:</span></p><ul><li>Verb always goes at the end</li><li>Postpositions instead of prepositions: میز پر (maiz par) = table on (= on the table)</li><li>Adjectives come before the noun: بڑا گھر (bara ghar) = big house</li><li>No definite/indefinite articles (no "the" or "a")</li></ul><p><span class="rule">Common patterns:</span></p><ul><li>"My name is ___" = میرا نام ___ ہے (lit: my name ___ is)</li><li>"I am from ___" = میں ___ سے ہوں (lit: I ___ from am)</li><li>"I need ___" = مجھے ___ چاہیے (lit: to-me ___ is-needed)</li></ul>',

  18: '<h3>Translation Tips: Urdu to English</h3><p><span class="rule">Recognizing verb forms:</span></p><ul><li>ہوں (hoon) = am (first person: میں)</li><li>ہے (hai) = is (third person singular: وہ, یہ)</li><li>ہیں (hain) = are (plural/formal: آپ, وہ pl.)</li><li>ہو (ho) = are (informal: تم)</li></ul><p><span class="rule">Common sentence endings:</span></p><ul><li>... تا/تی ہوں = I do (habitual present)</li><li>... رہا/رہی ہوں = I am doing (progressive)</li><li>... چاہیے = is needed / should</li><li>... لگی/لگا ہے = physical sensation (hunger, thirst, etc.)</li></ul><p><span class="rule">Watch for postpositions:</span></p><ul><li>میں (mein) = in</li><li>پر (par) = on</li><li>سے (se) = from, with, by</li><li>کو (ko) = to (object marker)</li><li>کا/کی/کے (ka/ki/ke) = of, possessive</li></ul>',

  19: '<h3>Common Error Patterns</h3><ul><li><span class="rule">Word order:</span> "میرا نام ہے علی" is awkward. Correct: "میرا نام علی ہے" (verb goes at the end).</li><li><span class="rule">Extra auxiliaries:</span> "مجھے پانی ہے چاہیے" has an extra ہے. Correct: "مجھے پانی چاہیے".</li><li><span class="rule">Verb agreement:</span> "آپ کیسے ہے" uses singular ہے with formal آپ. Correct: "آپ کیسے ہیں" (ہیں for آپ).</li><li><span class="rule">Possessive gender:</span> "وہ میری بھائی ہے" uses feminine میری with masculine بھائی. Correct: "وہ میرا بھائی ہے".</li><li><span class="rule">Chahiye construction:</span> "میں جانا ہے" mixes nominative with chahiye pattern. Correct: "مجھے جانا ہے" (oblique case with chahiye implied).</li><li><span class="rule">Number agreement:</span> "یہ کتاب ہیں" uses plural ہیں with singular کتاب. Correct: "یہ کتاب ہے".</li></ul>',

  20: '<h3>Conversation Patterns (مکالمہ)</h3><p><span class="rule">Meeting someone new:</span></p><ul><li>A: السلام علیکم! (Peace be upon you!)</li><li>B: وعلیکم السلام! (And upon you peace!)</li><li>A: آپ کا نام کیا ہے؟ (What is your name?)</li><li>B: میرا نام ___ ہے۔ (My name is ___.)</li><li>A: آپ سے مل کر خوشی ہوئی! (Nice to meet you!)</li></ul><p><span class="rule">Asking about wellbeing:</span></p><ul><li>آپ کیسے ہیں؟ (to male) / آپ کیسی ہیں؟ (to female)</li><li>Reply: میں ٹھیک ہوں، شکریہ۔ آپ سنائیے؟ (I\'m fine, thank you. How about you?)</li></ul><p><span class="rule">Asking about origin:</span></p><ul><li>آپ کہاں سے ہیں؟ (Where are you from?)</li><li>میں ___ سے ہوں۔ (I am from ___.)</li></ul>',

  21: '<h3>Grammar Review - Key Rules</h3><p><span class="rule">Sentence order:</span> SOV (Subject-Object-Verb)</p><p><span class="rule">Verb "to be" (ہونا):</span></p><table><tr><th>Pronoun</th><th>Present</th></tr><tr><td>میں (I)</td><td>ہوں (hoon)</td></tr><tr><td>تو (you, very informal)</td><td>ہے (hai)</td></tr><tr><td>تم (you, informal)</td><td>ہو (ho)</td></tr><tr><td>آپ (you, formal)</td><td>ہیں (hain)</td></tr><tr><td>وہ/یہ (he/she/it/this/that)</td><td>ہے (hai)</td></tr><tr><td>وہ/یہ (they/these/those)</td><td>ہیں (hain)</td></tr><tr><td>ہم (we)</td><td>ہیں (hain)</td></tr></table><p><span class="rule">Gender:</span> All nouns are masculine or feminine. Adjectives and verbs agree.</p><p><span class="rule">Postpositions:</span> میں (in), پر (on), سے (from), کو (to), کا/کی/کے (of)</p><p><span class="rule">Negation:</span> نہیں (nahi) = not. Goes before the verb: میں نہیں جاؤں گا (I will not go).</p>',

  22: '<h3>Gender Distinctions (مذکر و مونث)</h3><p><span class="rule">Adjective agreement:</span></p><table><tr><th>Masculine</th><th>Feminine</th><th>English</th></tr><tr><td>اچھا (achha)</td><td>اچھی (achhi)</td><td>good</td></tr><tr><td>بڑا (bara)</td><td>بڑی (bari)</td><td>big</td></tr><tr><td>چھوٹا (chhota)</td><td>چھوٹی (chhoti)</td><td>small</td></tr><tr><td>کیسا (kaisa)</td><td>کیسی (kaisi)</td><td>how (adj.)</td></tr><tr><td>میرا (mera)</td><td>میری (meri)</td><td>my</td></tr><tr><td>تمہارا (tumhara)</td><td>تمہاری (tumhari)</td><td>your</td></tr></table><p><span class="rule">Pattern:</span> Masculine adjectives ending in <strong>ا</strong> (a) change to <strong>ی</strong> (i) for feminine.</p><p><span class="rule">Verb agreement:</span></p><ul><li>وہ جاتا ہے (woh jata hai) = He goes</li><li>وہ جاتی ہے (woh jati hai) = She goes</li><li>Present habitual: stem + تا (ta, m.) / تی (ti, f.) / تے (te, m. pl.)</li></ul><p><span class="rule">Invariable adjectives:</span> Some adjectives do NOT change: خوش (khush), بیمار (beemar), صاف (saaf). These stay the same for both genders.</p>',

  23: '<h3>Everyday Sentences (روزمرہ کے فقرے)</h3><table><tr><th>Urdu</th><th>Transliteration</th><th>English</th></tr><tr><td dir="rtl">میں نہیں سمجھا</td><td>Main nahi samjha</td><td>I don\'t understand</td></tr><tr><td dir="rtl">آہستہ بولیے</td><td>Aahista boliye</td><td>Please speak slowly</td></tr><tr><td dir="rtl">یہ کتنے کا ہے؟</td><td>Yeh kitne ka hai?</td><td>How much is this?</td></tr><tr><td dir="rtl">مجھے نہیں معلوم</td><td>Mujhe nahi maloom</td><td>I don\'t know</td></tr><tr><td dir="rtl">ایک لمحہ رکیے</td><td>Ek lamha rukiye</td><td>Wait a moment</td></tr><tr><td dir="rtl">مجھے یہ پسند ہے</td><td>Mujhe yeh pasand hai</td><td>I like this</td></tr><tr><td dir="rtl">چلیں</td><td>Chalein</td><td>Let\'s go</td></tr></table><p><span class="rule">Survival tip:</span> Even just knowing "معاف کیجیے، مجھے اردو نہیں آتی" (Maaf kijiye, mujhe Urdu nahi aati = Sorry, I don\'t know Urdu) and "کیا آپ انگریزی بولتے ہیں؟" (Kya aap Angrezi bolte hain? = Do you speak English?) can be lifesavers.</p>',

  24: '<h3>Vocabulary Quick Fire Tips</h3><p><span class="rule">Time words:</span> آج (aaj = today), کل (kal = tomorrow AND yesterday), ابھی (abhi = now), ہمیشہ (hamesha = always), کبھی نہیں (kabhi nahi = never)</p><p><span class="rule">Note on کل:</span> کل means BOTH "yesterday" and "tomorrow" in Urdu. Context tells you which: کل میں گیا تھا (kal main gaya tha = yesterday I went) vs کل میں جاؤں گا (kal main jaoon ga = tomorrow I will go).</p><p><span class="rule">Connectors:</span> اور (aur = and), لیکن/مگر (lekin/magar = but), یا (ya = or), بھی (bhi = also/too), کے ساتھ (ke saath = with), کے بغیر (ke baghair = without)</p><p><span class="rule">Common adjectives:</span> بڑا (bara = big), چھوٹا (chhota = small), اچھا (achha = good), برا (bura = bad), نیا (naya = new), پرانا (purana = old)</p>',

  25: '<h3>All Concepts Combined - Summary</h3><p><span class="rule">Greetings:</span> السلام علیکم / وعلیکم السلام, صبح بخیر, شام بخیر, خدا حافظ</p><p><span class="rule">Introduction:</span> میرا نام ___ ہے, میں ___ سے ہوں, آپ کا نام کیا ہے؟</p><p><span class="rule">Polite:</span> شکریہ, براہ کرم, معاف کیجیے, کوئی بات نہیں</p><p><span class="rule">Verb "to be":</span> ہوں (I), ہے (he/she/it), ہو (you informal), ہیں (you formal/they/we)</p><p><span class="rule">Word order:</span> SOV: Subject + Object + Verb</p><p><span class="rule">Gender:</span> All nouns have gender. Adjectives ending in ا(m.) change to ی(f.).</p><p><span class="rule">Chahiye:</span> مجھے + noun + چاہیے = I need ___</p><p><span class="rule">Feelings:</span> میں + adj + ہوں (emotions). مجھے + noun + لگی/لگ رہی ہے (physical sensations).</p><p><span class="rule">Negation:</span> نہیں (nahi) before the verb.</p><p><span class="rule">Questions:</span> کیا (what/yes-no marker), کون (who), کہاں (where), کب (when), کیوں (why), کیسے (how)</p><p><span class="rule">Postpositions:</span> میں (in), پر (on), سے (from), کو (to), کا/کی/کے (of)</p><p><span class="rule">Formality:</span> تو (intimate) < تم (informal) < آپ (formal/respectful)</p>'
};

let score = 0;
let total = 0;
const totalInputs = countTotalInputs();

function countTotalInputs() {
  let c = 0;
  for (const ex of EXERCISES) {
    if (ex.type === 'mc') c += ex.questions.length;
    else if (ex.type === 'dialogue') {
      for (const line of ex.lines) for (const p of line.parts) if (typeof p === 'object' && p.blank) c++;
    } else if (ex.type === 'freeform') { /* no auto-scoring */ }
    else c += ex.rows.length;
  }
  return c;
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent = score + ' / ' + totalInputs;
  const pct = totalInputs > 0 ? Math.round(score / totalInputs * 100) : 0;
  document.getElementById('pctDisplay').textContent = '(' + pct + '%)';
  if (typeof saveProgress === 'function') saveProgress(true);
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[?.!,]+$/,'').replace(/[?.!,]+/g,function(m){return m;});
}

function normalizeForCompare(s) {
  return s.trim().toLowerCase().replace(/\s+/g,' ');
}

function checkAnswer(inputEl) {
  if (inputEl.classList.contains('correct')) return;

  const wasWrong = inputEl.classList.contains('wrong');
  if (wasWrong) {
    inputEl.classList.remove('wrong');
    inputEl.readOnly = false;
    inputEl.classList.remove('answered');
    const revealEl = inputEl.parentElement.querySelector('.answer-reveal');
    if (revealEl) { revealEl.classList.remove('show'); revealEl.textContent = ''; }
    const hintEl = inputEl.parentElement.querySelector('.hint-text');
    if (hintEl) { hintEl.classList.remove('show'); hintEl.textContent = ''; delete hintEl.dataset.level; }
  }

  const userVal = normalizeForCompare(inputEl.value);
  if (!userVal) return;

  const answers = inputEl.dataset.answer.split('/').map(a => normalizeForCompare(a));
  const revealEl = inputEl.parentElement.querySelector('.answer-reveal');
  let matched = false;

  for (const ans of answers) {
    if (userVal === ans) { matched = true; break; }
    const userNoPunct = userVal.replace(/[?.!,؟۔،]/g,'').trim();
    const ansNoPunct = ans.replace(/[?.!,؟۔،]/g,'').trim();
    if (userNoPunct === ansNoPunct) { matched = true; break; }
  }

  if (matched) {
    inputEl.readOnly = true;
    inputEl.classList.add('answered','correct');
    score++;
    const cm = document.createElement('span');
    cm.className = 'checkmark';
    cm.textContent = ' \u2713';
    inputEl.parentElement.appendChild(cm);
  } else {
    inputEl.classList.add('wrong');
    if (revealEl) {
      revealEl.textContent = '\u2192 ' + inputEl.dataset.answer.split('/')[0].trim();
      revealEl.classList.add('show');
    }
  }
  updateScore();
  if (matched) focusNext(inputEl);
}

function focusNext(currentEl) {
  const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
  const idx = allInputs.indexOf(currentEl);
  for (let i = idx + 1; i < allInputs.length; i++) {
    if (!allInputs[i].classList.contains('correct')) { ensureVisibleAndFocus(allInputs[i]); return; }
  }
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  score = 0; total = 0;
  document.querySelectorAll('input[type="text"]').forEach(el => {
    el.value = ''; el.readOnly = false;
    el.classList.remove('answered','correct','wrong');
    const cm = el.parentElement.querySelector('.checkmark');
    if (cm) cm.remove();
    const rev = el.parentElement.querySelector('.answer-reveal');
    if (rev) { rev.classList.remove('show'); rev.textContent = ''; }
    const hint = el.parentElement.querySelector('.hint-text');
    if (hint) { hint.classList.remove('show'); hint.textContent = ''; delete hint.dataset.level; }
  });
  document.querySelectorAll('input[type="radio"]').forEach(el => {
    el.checked = false; el.disabled = false;
  });
  document.querySelectorAll('.mc-option').forEach(el => {
    el.classList.remove('correct-choice','wrong-choice','reveal-correct','locked','answered');
  });
  document.querySelectorAll('.mc-group').forEach(el => el.classList.remove('answered'));
  document.querySelectorAll('.model-answer').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('textarea').forEach(el => el.value = '');
  localStorage.removeItem('urdu_exercises');
  fetch('/api/progress', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}).catch(()=>{});
  updateScore();
  const first = document.querySelector('input[type="text"]');
  if (first) first.focus();
}

const STORAGE_KEY = 'urdu_exercises';

function saveProgress(silent) {
  const data = {score: score, inputs: [], radios: [], textareas: [], openExercises: []};

  document.querySelectorAll('input[type="text"]').forEach((el, i) => {
    data.inputs.push({
      value: el.value,
      correct: el.classList.contains('correct'),
      wrong: el.classList.contains('wrong')
    });
  });

  document.querySelectorAll('.mc-group').forEach((group, i) => {
    const selected = group.querySelector('input[type="radio"]:checked');
    data.radios.push({
      answered: group.classList.contains('answered'),
      selected: selected ? parseInt(selected.value) : null
    });
  });

  document.querySelectorAll('textarea').forEach((el, i) => {
    data.textareas.push(el.value);
  });

  document.querySelectorAll('.exercise-body').forEach(body => {
    if (body.classList.contains('open')) data.openExercises.push(body.id);
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  fetch('/api/progress', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).catch(()=>{});

  const status = document.getElementById('saveStatus');
  if (!silent) {
    status.textContent = 'Saved!';
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 2000);
  }
}

function applyProgress(data) {
  if (!data || !data.inputs) { updateScore(); return; }
  score = 0;

  const inputs = document.querySelectorAll('input[type="text"]');
  inputs.forEach((el, i) => {
    if (!data.inputs[i]) return;
    const saved = data.inputs[i];
    el.value = saved.value;
    if (saved.correct) {
      el.readOnly = true;
      el.classList.add('answered','correct');
      score++;
      const cm = document.createElement('span');
      cm.className = 'checkmark';
      cm.textContent = ' \u2713';
      el.parentElement.appendChild(cm);
    } else if (saved.wrong) {
      el.classList.add('wrong');
      const revealEl = el.parentElement.querySelector('.answer-reveal');
      if (revealEl) {
        revealEl.textContent = '\u2192 ' + el.dataset.answer.split('/')[0].trim();
        revealEl.classList.add('show');
      }
    }
  });

  const mcGroups = document.querySelectorAll('.mc-group');
  mcGroups.forEach((group, i) => {
    if (!data.radios[i] || !data.radios[i].answered) return;
    const saved = data.radios[i];
    group.classList.add('answered');
    const correctIdx = parseInt(group.dataset.correct);
    const options = group.querySelectorAll('.mc-option');
    const radio = group.querySelector('input[value="' + saved.selected + '"]');
    if (radio) radio.checked = true;
    options.forEach(opt => {
      opt.classList.add('locked');
      opt.querySelector('input').disabled = true;
    });
    if (saved.selected === correctIdx) {
      options[saved.selected].classList.add('correct-choice');
      score++;
    } else {
      options[saved.selected].classList.add('wrong-choice');
      options[correctIdx].classList.add('reveal-correct');
    }
  });

  document.querySelectorAll('textarea').forEach((el, i) => {
    if (data.textareas[i]) el.value = data.textareas[i];
  });

  if (data.openExercises) {
    document.querySelectorAll('.exercise-body').forEach(body => {
      const id = body.id.replace('body-','');
      const arrow = document.getElementById('arrow-' + id);
      if (data.openExercises.includes(body.id)) {
        body.classList.add('open');
        if (arrow) arrow.classList.add('open');
      } else {
        body.classList.remove('open');
        if (arrow) arrow.classList.remove('open');
      }
    });
  }

  updateScore();
}

function loadProgress() {
  fetch('/api/progress').then(r => r.json()).then(data => {
    if (data && data.inputs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      applyProgress(data);
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { updateScore(); return; }
      try { applyProgress(JSON.parse(raw)); } catch(e) { updateScore(); }
    }
  }).catch(() => {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { updateScore(); return; }
    try { applyProgress(JSON.parse(raw)); } catch(e) { updateScore(); }
  });
}

function toggleExercise(id) {
  const body = document.getElementById('body-' + id);
  const arrow = document.getElementById('arrow-' + id);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function buildTableExercise(ex) {
  const answerColIdx = ex.cols.indexOf("Your Answer");
  const solutionColIdx = ex.cols.indexOf("Solution");

  let visibleCols = [];
  for (let i = 0; i < ex.cols.length; i++) {
    if (i === solutionColIdx) continue;
    visibleCols.push({colIdx: i, name: ex.cols[i]});
  }

  let html = '<table><thead><tr>';
  for (const vc of visibleCols) html += '<th>' + vc.name + '</th>';
  html += '</tr></thead><tbody>';

  for (const row of ex.rows) {
    html += '<tr>';
    const answer = row[row.length - 1];
    let dataIdx = 0;
    for (const vc of visibleCols) {
      if (vc.colIdx === answerColIdx) {
        html += '<td class="ex-cell"><input type="text" data-answer="' + escAttr(answer) + '" autocomplete="off" spellcheck="false"><div class="answer-reveal"></div></td>';
      } else if (vc.colIdx === 0) {
        html += '<td class="num">' + row[0] + '</td>';
        dataIdx++;
      } else {
        html += '<td>' + escHtml(row[dataIdx]) + '</td>';
        dataIdx++;
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

function buildDialogue(ex) {
  let html = '<div class="dialogue">';
  for (const line of ex.lines) {
    html += '<p><span class="speaker">' + line.speaker + ':</span> ';
    for (const part of line.parts) {
      if (typeof part === 'string') {
        html += escHtml(part);
      } else if (part.blank) {
        html += '<span class="ex-cell" style="display:inline"><input type="text" data-answer="' + escAttr(part.answer) + '" autocomplete="off" spellcheck="false" placeholder="___"><div class="answer-reveal"></div></span>';
        if (part.hint) html += ' <span class="hint">(' + escHtml(part.hint) + ')</span>';
      }
    }
    html += '</p>';
  }
  html += '</div>';
  return html;
}

function buildMC(ex) {
  let html = '';
  ex.questions.forEach((q, qi) => {
    const name = 'mc_' + ex.id + '_' + qi;
    html += '<div class="mc-group" data-correct="' + q.correct + '" data-name="' + name + '">';
    html += '<div class="mc-q">' + (qi+1) + '. ' + escHtml(q.q) + '</div>';
    q.options.forEach((opt, oi) => {
      html += '<label class="mc-option" data-idx="' + oi + '"><input type="radio" name="' + name + '" value="' + oi + '"> ' + escHtml(opt) + '</label>';
    });
    html += '</div>';
  });
  return html;
}

function buildFreeform(ex) {
  let html = '<textarea placeholder="Write your Urdu here..."></textarea>';
  html += '<br><button class="model-btn" onclick="this.nextElementSibling.classList.toggle(\'show\')">Show Model Answer</button>';
  html += '<div class="model-answer">' + escHtml(ex.modelAnswer).replace(/\n/g,'<br>') + '</div>';
  return html;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showTheory(id) {
  const overlay = document.getElementById('theoryOverlay');

  content.innerHTML = THEORY[id] || '<p>No theory available for this exercise.</p>';
  overlay.classList.add('show');
}

function hideTheory() {

// Ensure an input's parent exercise is expanded, then focus it
function ensureVisibleAndFocus(input) {
  const body = input.closest('.exercise-body');
  if (body && !body.classList.contains('open')) {
    body.classList.add('open');
    const id = body.id.replace('body-','');
    const arrow = document.getElementById('arrow-' + id);
    if (arrow) arrow.classList.add('open');
  }
  input.focus();
  input.scrollIntoView({block:'nearest',behavior:'smooth'});
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    saveProgress();
    return;
  }

  if (e.ctrlKey && e.key === 'i' && e.target.matches('input[type="text"]')) {
    e.preventDefault();
    if (e.target.classList.contains('correct')) return;
    const answer = e.target.dataset.answer;
    if (!answer) return;
    const primary = answer.split('/')[0].trim();
    let hintEl = e.target.parentElement.querySelector('.hint-text');
    if (!hintEl) {
      hintEl = document.createElement('div');
      hintEl.className = 'hint-text';
      e.target.parentElement.appendChild(hintEl);
    }
    if (hintEl.dataset.level === '1') {
      hintEl.textContent = '\u2192 ' + primary;
      hintEl.dataset.level = '2';
    } else {
      const hintLen = Math.min(3, Math.ceil(primary.length * 0.3));
      hintEl.textContent = 'Hint: ' + primary.substring(0, hintLen) + '...';
      hintEl.dataset.level = '1';
    }
    hintEl.classList.add('show');
    return;
  }

  if (e.ctrlKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    window.scrollBy({top: e.key === 'ArrowDown' ? 400 : -400, behavior:'smooth'});
    return;
  }

  if (e.key === 'Tab' && e.target.matches('input[type="text"]')) {
    const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
    const idx = allInputs.indexOf(e.target);
    if (idx === -1) return;
    const nextIdx = e.shiftKey ? idx - 1 : idx + 1;
    if (nextIdx >= 0 && nextIdx < allInputs.length) {
      e.preventDefault();
      ensureVisibleAndFocus(allInputs[nextIdx]);
    }
    return;
  }

  if (!e.target.matches('input[type="text"]')) return;

  if (e.key === 'Enter') {
    e.preventDefault();
    checkAnswer(e.target);
    return;
  }

  const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
  const idx = allInputs.indexOf(e.target);
  if (idx === -1) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (idx < allInputs.length - 1) ensureVisibleAndFocus(allInputs[idx + 1]);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (idx > 0) ensureVisibleAndFocus(allInputs[idx - 1]);
  } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
    e.preventDefault();
    if (idx < allInputs.length - 1) ensureVisibleAndFocus(allInputs[idx + 1]);
  } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
    e.preventDefault();
    if (idx > 0) ensureVisibleAndFocus(allInputs[idx - 1]);
  }
});

// Event delegation for MC radio buttons
document.addEventListener('change', function(e) {
  if (e.target.matches('input[type="radio"]')) {
    const group = e.target.closest('.mc-group');
    if (!group || group.classList.contains('answered')) return;
    group.classList.add('answered');

    const correctIdx = parseInt(group.dataset.correct);
    const selectedIdx = parseInt(e.target.value);
    const options = group.querySelectorAll('.mc-option');

    total++;
    options.forEach(opt => {
      opt.classList.add('locked');
      opt.querySelector('input').disabled = true;
    });

    if (selectedIdx === correctIdx) {
      options[selectedIdx].classList.add('correct-choice');
      score++;
    } else {
      options[selectedIdx].classList.add('wrong-choice');
      options[correctIdx].classList.add('reveal-correct');
    }
    updateScore();
  }
});

function loadPracticeBadges() {
  for (let i = 1; i <= 25; i++) {
    const key = 'urdu_practice_' + String(i).padStart(2,'0');
    const raw = localStorage.getItem(key);
    if (!raw) continue;
    try {
      const data = JSON.parse(raw);
      if (typeof data.total !== 'number' || data.total === 0) continue;
      const badge = document.getElementById('badge-' + i);
      if (!badge) continue;
      const s = data.score || 0;
      badge.textContent = s + '/' + data.total;
      badge.classList.add('has-progress');
      if (s === data.total) badge.classList.add('complete');
    } catch(e) {}
  }
}

function getVerbTense_UR(verb, tenseKey, gender) {
  if (!verb || !verb.conj || !verb.conj[tenseKey]) return null;
  var t = verb.conj[tenseKey];
  if (tenseKey === "imper") return t.forms;
  return gender === "f" ? t.f : t.m;
}

function getVerbTenseRoman_UR(verb, tenseKey, gender) {
  if (!verb || !verb.conj || !verb.conj[tenseKey]) return null;
  var t = verb.conj[tenseKey];
  if (tenseKey === "imper") return t.roman;
  return gender === "f" ? t.roman_f : t.roman_m;
}

var conjCurrentGender = 'm';


// ─── B) SHOW / HIDE CONJUGATION OVERLAY ──────────────────────────────────

// ─── C) BUILD VERB SIDEBAR ──────────────────────────────────────────────

function buildConjList() {
  var html = '';
  CAT_ORDER_UR.forEach(function(cat) {
    var verbs = VERB_DATA_UR.filter(function(v) { return v.cat === cat; });
    if (!verbs.length) return;
    html += '<div class="conj-cat-label">' + CAT_LABELS_UR[cat] + '</div>';
    verbs.forEach(function(v) {
      html += '<button class="conj-verb-btn" data-inf="' + v.inf + '" onclick="selectVerb(\'' + v.inf + '\')">';
      html += v.inf + ' <span class="conj-verb-en">' + v.en + '</span>';
      html += '</button>';
    });
  });
  document.getElementById('conjList').innerHTML = html;
}


// ─── D) SELECT VERB — SHOW CONJUGATION TABLE ────────────────────────────

function selectVerb(inf) {
  var v = null;
  for (var i = 0; i < VERB_DATA_UR.length; i++) {

  if (!v) return;

  // Highlight active button
  var allBtns = document.querySelectorAll('.conj-verb-btn');
  for (var b = 0; b < allBtns.length; b++) allBtns[b].classList.remove('active');
  var activeBtn = document.querySelector('.conj-verb-btn[data-inf="' + inf + '"]');
  if (activeBtn) activeBtn.classList.add('active');

  var html = '<h3 class="conj-verb-title">' + v.inf + '</h3>';
  html += '<div class="conj-verb-meta">';
  html += '<span><b>English:</b> ' + v.en + '</span>';
  html += '<span><b>Category:</b> ' + CAT_LABELS_UR[v.cat] + '</span>';
  html += '<span><b>Stem:</b> ' + v.stem + '</span>';

  html += '<div style="margin-bottom:14px;display:flex;align-items:center;gap:8px">';
  html += '<span style="color:#888;font-size:.85em">Gender:</span>';

  html += '<button id="genderBtnF" class="drill-setup-option' + (conjCurrentGender === 'f' ? ' active' : '') + '" onclick="conjCurrentGender=\'f\';selectVerb(\'' + v.inf + '\')" style="padding:4px 14px;font-size:.82em">\u0645\u0624\u0646\u062B Feminine</button>';
  html += '</div>';

  html += '<div class="conj-tenses-grid">';

  TENSE_GROUPS_UR.forEach(function(group) {
    html += '<div class="conj-tense-group-label">' + group.label + '</div>';
    group.tenses.forEach(function(key) {
      var isImper = (key === 'imper');
      var forms = getVerbTense_UR(v, key, conjCurrentGender);

      if (!forms) return;

      html += '<div class="conj-tense-card">';
      html += '<h4>' + TENSE_LABELS_UR[key];

      }

        html += ' <span style="color:#888;font-size:.75em;font-style:italic">(no gender)</span>';
      }
      html += '</h4>';
      html += '<table class="conj-tense-table">';

        html += '<td>' + p + '</td>';
        html += '<td>';

          html += '<span class="drill-na">-</span>';

          html += '<span class="urdu-form">' + formVal + '</span>';
          html += ' <span class="urdu-roman">(' + romanVal + ')</span>';
        }
        html += '</td>';
        html += '</tr>';
      });
      html += '</table></div>';
    });
  });
  html += '</div>';

  document.getElementById('conjMain').innerHTML = html;

// ─── E) FILTER VERBS (search) ───────────────────────────────────────────

function filterVerbs() {
  var q = document.getElementById('conjSearch').value.toLowerCase().trim();
  var btns = document.querySelectorAll('.conj-verb-btn');
  for (var i = 0; i < btns.length; i++) {
    var btn = btns[i];
    var inf = btn.getAttribute('data-inf');
    var v = null;
    for (var j = 0; j < VERB_DATA_UR.length; j++) {
      if (VERB_DATA_UR[j].inf === inf) { v = VERB_DATA_UR[j]; break; }
    }
    var match = !q || inf.indexOf(q) >= 0 || (v && v.en.toLowerCase().indexOf(q) >= 0);
    btn.style.display = match ? '' : 'none';
  }
  // Hide empty category labels
  var labels = document.querySelectorAll('.conj-cat-label');
  for (var k = 0; k < labels.length; k++) {
    var label = labels[k];
    var next = label.nextElementSibling;
    var anyVisible = false;
    while (next && !next.classList.contains('conj-cat-label')) {
      if (next.style.display !== 'none') anyVisible = true;
      next = next.nextElementSibling;
    }
    label.style.display = anyVisible ? '' : 'none';
  }
}


// ─── F) SWITCH CONJUGATION TAB ──────────────────────────────────────────

function switchConjTab(tabName) {
  var tabs = document.querySelectorAll('.conj-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  var tabBtn = document.querySelector('.conj-tab[data-tab="' + tabName + '"]');
  if (tabBtn) tabBtn.classList.add('active');

  var contents = document.querySelectorAll('.conj-tab-content');
  for (var j = 0; j < contents.length; j++) contents[j].classList.remove('active');
  var panel = document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1));
  if (panel) panel.classList.add('active');

  // Lazy-load tab content
  if (tabName === 'practice' && typeof showPracticeMenu === 'function') showPracticeMenu();
  if (tabName === 'grammar') renderGrammarIndex();
  if (tabName === 'progress') renderProgressTab();
  if (tabName === 'campaign' && typeof renderCampaignMap === 'function') renderCampaignMap();
}


// ─── G) GRAMMAR TAB ─────────────────────────────────────────────────────

// ─── I) HEATMAP ─────────────────────────────────────────────────────────

function renderHeatMap() {
  var tenseKeys = Object.keys(TENSE_LABELS_UR);
  var html = '<table class="heatmap-table"><tr><th></th>';
  for (var t = 0; t < tenseKeys.length; t++) {
    var label = TENSE_LABELS_UR[tenseKeys[t]];
    // Show short label (first 4 chars of romanized part)
    var shortLabel = tenseKeys[t].substring(0, 4);
    html += '<th title="' + label + '">' + shortLabel + '</th>';
  }
  html += '</tr>';

  for (var vi = 0; vi < VERB_DATA_UR.length; vi++) {
    var v = VERB_DATA_UR[vi];
    html += '<tr><td class="heatmap-verb">' + v.inf + '</td>';
    for (var ti = 0; ti < tenseKeys.length; ti++) {
      var tk = tenseKeys[ti];
      var pctVal = 0;
      var color = '#333';
      if (conjProgress && conjProgress.verbMastery && conjProgress.verbMastery[v.inf] && conjProgress.verbMastery[v.inf][tk]) {
        var m = conjProgress.verbMastery[v.inf][tk];
        pctVal = m.total > 0 ? Math.round(m.correct / m.total * 100) : 0;
        if (pctVal === 0) color = '#e74c3c';
        else if (pctVal < 50) color = '#e67e22';
        else if (pctVal < 80) color = '#f1c40f';
        else color = '#2ecc71';
      }
      html += '<td><div class="heatmap-cell" style="background:' + color + '" title="' + v.inf + ' ' + TENSE_LABELS_UR[tk] + ': ' + pctVal + '%"></div></td>';
    }
    html += '</tr>';
  }
  html += '</table>';
  return html;
}


// ─── J) LOAD / SAVE CONJUGATION PROGRESS ────────────────────────────────

function loadConjProgress() {
  var saved = localStorage.getItem(CONJ_STORAGE_KEY_UR);
  if (saved) {
    try {
      conjProgress = JSON.parse(saved);
      // Merge any missing defaults
      var defaults = getDefaultProgress_UR();
      var keys = Object.keys(defaults);
      for (var i = 0; i < keys.length; i++) {
        if (conjProgress[keys[i]] === undefined) {
          conjProgress[keys[i]] = defaults[keys[i]];
        }
      }
    } catch (e) {
      conjProgress = getDefaultProgress_UR();
    }
  } else {
    conjProgress = getDefaultProgress_UR();
  }
  conjProgress.sessionStart = Date.now();
  // Check time-based badges
  var hour = new Date().getHours();
  if (hour >= 0 && hour < 5) conjProgress.nightOwl = true;
  if (hour >= 4 && hour < 7) conjProgress.earlyBird = true;
  saveConjProgress();
}

function saveConjProgress() {
  if (!conjProgress) return;
  if (conjProgress.sessionStart) {
    var mins = Math.floor((Date.now() - conjProgress.sessionStart) / 60000);
    if (mins > conjProgress.longestSession) conjProgress.longestSession = mins;
  }
  localStorage.setItem(CONJ_STORAGE_KEY_UR, JSON.stringify(conjProgress));
}


// ─── K) XP SYSTEM ───────────────────────────────────────────────────────

function addXP(amount, tenseKey, catKey) {
  if (!conjProgress) loadConjProgress();
  var multiplier = 1;
  if (tenseKey && TENSE_DIFFICULTY_UR[tenseKey]) multiplier *= TENSE_DIFFICULTY_UR[tenseKey];
  if (catKey && CAT_DIFFICULTY_UR[catKey]) multiplier *= CAT_DIFFICULTY_UR[catKey];
  // Streak bonus
  if (conjProgress.currentStreak >= 10) multiplier *= 2;
  else if (conjProgress.currentStreak >= 5) multiplier *= 1.5;
  var xpGained = Math.round(amount * multiplier);
  conjProgress.xp += xpGained;
  conjProgress.totalXP += xpGained;
  checkLevelUp();
  saveConjProgress();
  updateXPDisplay();
  return xpGained;
}

function checkLevelUp() {
  if (!conjProgress) return;
  var leveled = false;
  while (conjProgress.level < 50 && conjProgress.xp >= LEVEL_THRESHOLDS_UR[conjProgress.level - 1]) {
    conjProgress.xp -= LEVEL_THRESHOLDS_UR[conjProgress.level - 1];
    conjProgress.level++;
    leveled = true;
    showNotification('\uD83C\uDF89 Level Up!', 'You reached Level ' + conjProgress.level + ' \u2014 ' + getLevelTitle(conjProgress.level), 'levelup');
  }
  if (leveled) checkBadges();
}

function getXPForCurrentLevel() {
  if (!conjProgress) return { current: 0, needed: 100 };
  var needed = LEVEL_THRESHOLDS_UR[conjProgress.level - 1] || 999999;
  return { current: conjProgress.xp, needed: needed };
}

function getLevelTitle(level) {
  var title = '\u0646\u0648\u0622\u0645\u0648\u0632 (Beginner)';
  var thresholds = Object.keys(LEVEL_TITLES_UR);
  for (var i = 0; i < thresholds.length; i++) {
    var lvl = parseInt(thresholds[i]);
    if (level >= lvl) title = LEVEL_TITLES_UR[lvl];
  }
  return title;
}


// ─── L) BADGE CHECKING ─────────────────────────────────────────────────

function checkBadges() {
  if (!conjProgress) return;
  var newBadges = [];
  for (var i = 0; i < BADGE_DEFS_UR.length; i++) {
    var badge = BADGE_DEFS_UR[i];
    if (conjProgress.badges.indexOf(badge.id) < 0) {
      try {
        if (badge.check(conjProgress)) {
          conjProgress.badges.push(badge.id);
          newBadges.push(badge);
          showNotification(badge.icon + ' Badge Earned!', badge.name + ' \u2014 ' + badge.desc, 'badge');
        }
      } catch (e) { /* badge check failed, skip */ }
    }
  }
  if (newBadges.length) saveConjProgress();
  return newBadges;
}


// ─── M) NOTIFICATION QUEUE SYSTEM ───────────────────────────────────────

function showNotification(title, message, type) {
  notificationQueue.push({ title: title, message: message, type: type });
  if (!notificationActive) processNotificationQueue();
}

function processNotificationQueue() {
  if (notificationQueue.length === 0) { notificationActive = false; return; }
  notificationActive = true;
  var n = notificationQueue.shift();
  var el = document.createElement('div');
  el.className = 'conj-notification conj-notification-' + (n.type || 'info');
  el.innerHTML = '<div class="conj-notif-title">' + n.title + '</div><div class="conj-notif-msg">' + n.message + '</div>';
  document.body.appendChild(el);
  requestAnimationFrame(function() {
    el.classList.add('show');
  });
  setTimeout(function() {
    el.classList.remove('show');
    setTimeout(function() {
      el.remove();
      processNotificationQueue();
    }, 400);
  }, 3000);
}


// ─── N) UPDATE XP DISPLAY ───────────────────────────────────────────────

function updateXPDisplay() {
  var el = document.getElementById('xpDisplay');
  if (!el || !conjProgress) return;
  var xpInfo = getXPForCurrentLevel();
  el.textContent = 'Lv.' + conjProgress.level + ' \u2B21 ' + xpInfo.current + '/' + xpInfo.needed + ' XP';
  el.title = getLevelTitle(conjProgress.level) + ' \u2014 Total XP: ' + conjProgress.totalXP;
}


// ─── O) TENSE THEORY POPUP ─────────────────────────────────────────────

function showConjTheory(tenseKey) {
  var body = document.getElementById('conjTheoryBody');
  if (!body || !CONJ_THEORY_UR || !CONJ_THEORY_UR[tenseKey]) return;
  body.innerHTML = CONJ_THEORY_UR[tenseKey];
  document.getElementById('conjTheoryPopup').classList.add('show');
}

function hideConjTheory() {
  document.getElementById('conjTheoryPopup').classList.remove('show');
}


// ─── SUPPORT FUNCTIONS ──────────────────────────────────────────────────

function recordTheoryRead(topicId) {
  if (!conjProgress) loadConjProgress();
  if (!conjProgress.theoryRead) conjProgress.theoryRead = {};
  conjProgress.theoryRead[topicId] = true;
  saveConjProgress();
  checkBadges();
}

function resetConjProgress() {
  if (!confirm('Reset all conjugation progress? XP, badges, and mastery data will be lost.')) return;

function recordDrillAnswer(verb, tenseKey, isCorrect) {
  if (!conjProgress) return;
  conjProgress.totalAnswers++;
  if (isCorrect) {
    conjProgress.totalCorrect++;
    conjProgress.currentStreak++;
    if (conjProgress.currentStreak > conjProgress.bestStreak) conjProgress.bestStreak = conjProgress.currentStreak;
  } else {
    conjProgress.currentStreak = 0;
  }
  if (!conjProgress.verbsUsed[verb]) conjProgress.verbsUsed[verb] = 0;
  conjProgress.verbsUsed[verb]++;
  if (!conjProgress.tensesUsed[tenseKey]) conjProgress.tensesUsed[tenseKey] = 0;
  conjProgress.tensesUsed[tenseKey]++;
  if (!conjProgress.tenseCorrect[tenseKey]) conjProgress.tenseCorrect[tenseKey] = 0;
  if (isCorrect) conjProgress.tenseCorrect[tenseKey]++;
  if (!conjProgress.verbMastery[verb]) conjProgress.verbMastery[verb] = { attempts: 0, correct: 0, score: 0 };
  conjProgress.verbMastery[verb].attempts++;
  if (isCorrect) conjProgress.verbMastery[verb].correct++;
  conjProgress.verbMastery[verb].score = Math.round((conjProgress.verbMastery[verb].correct / conjProgress.verbMastery[verb].attempts) * 100);
  var h = new Date().getHours();
  if (h >= 0 && h < 5) conjProgress.nightOwl = true;
  if (h >= 5 && h < 7) conjProgress.earlyBird = true;
  if (conjProgress.sessionStart) {
    var mins = Math.round((Date.now() - conjProgress.sessionStart) / 60000);
    if (mins > conjProgress.longestSession) conjProgress.longestSession = mins;
  }
  saveConjProgress();
}

//   CAT_LABELS_UR, CAT_ORDER_UR, TENSE_GROUPS_UR, XP_SOURCES_UR,

// ─── NORMALIZE URDU COMPARE ───
// Accepts user input and compares against BOTH Urdu script and romanized form.
// Returns true if either matches.
function normalizeUrduCompare(input, correctUrdu, correctRoman) {
  if (!input) return false;
  var trimmed = input.trim();
  if (!trimmed) return false;

  // Compare against Urdu script (trim only, Urdu is case-insensitive by nature)
  var urduTrimmed = correctUrdu ? correctUrdu.trim() : '';
  if (urduTrimmed && trimmed === urduTrimmed) return true;

  // Compare against romanized (trim + lowercase)
  var romanTrimmed = correctRoman ? correctRoman.trim().toLowerCase() : '';
  var inputLower = trimmed.toLowerCase();
  if (romanTrimmed && inputLower === romanTrimmed) return true;

  // Normalize whitespace (collapse multiple spaces)
  var inputNorm = inputLower.replace(/\s+/g, ' ');
  var urduNorm = urduTrimmed.replace(/\s+/g, ' ');
  var romanNorm = romanTrimmed.replace(/\s+/g, ' ');
  if (urduNorm && trimmed.replace(/\s+/g, ' ') === urduNorm) return true;
  if (romanNorm && inputNorm === romanNorm) return true;

  return false;
}

// ─── HELPER: get correct forms for a question ───
function getDrillAnswer_UR(verb, tenseKey, personIdx, gender) {
  var urduForm, romanForm;
  if (tenseKey === 'imper') {
    urduForm = verb.conj.imper.forms[personIdx];
    romanForm = verb.conj.imper.roman[personIdx];
  } else {
    var urduArr = getVerbTense_UR(verb, tenseKey, gender);
    var romanArr = getVerbTenseRoman_UR(verb, tenseKey, gender);
    urduForm = urduArr ? urduArr[personIdx] : null;
    romanForm = romanArr ? romanArr[personIdx] : null;
  }
  return { urdu: urduForm, roman: romanForm };
}

// ─── HELPER: gender badge HTML ───
function genderBadgeHTML_UR(gender) {
  if (gender === 'm') return '<span class="drill-gender-badge drill-gender-m">مذکر (M)</span>';
  if (gender === 'f') return '<span class="drill-gender-badge drill-gender-f">مؤنث (F)</span>';
  return '';
}

// ─── HELPER: escape HTML ───
function escHtml_UR(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escAttr_UR(s) { return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ═══════════════════════════════════════════
// B) startQuickDrill
// ═══════════════════════════════════════════
function startQuickDrill_UR(options) {
  var count = (options && options.count) ? options.count : 10;
  var tensePool = (options && options.tenses) ? options.tenses : Object.keys(TENSE_LABELS_UR);
  var verbPool = (options && options.verbs) ? options.verbs : null;

  var questions = [];
  var attempts = 0;
  while (questions.length < count && attempts < count * 10) {
    attempts++;
    var verb;
    if (verbPool) {
      var vi = verbPool[Math.floor(Math.random() * verbPool.length)];
      verb = VERB_DATA_UR.find(function(v) { return v.inf === vi; });
      if (!verb) continue;
    } else {
      verb = VERB_DATA_UR[Math.floor(Math.random() * VERB_DATA_UR.length)];
    }
    var tense = tensePool[Math.floor(Math.random() * tensePool.length)];
    var personIdx = Math.floor(Math.random() * 6);
    var gender = (tense === 'imper') ? null : (Math.random() < 0.5 ? 'm' : 'f');

    var ans = getDrillAnswer_UR(verb, tense, personIdx, gender);
    if (!ans.urdu || ans.urdu === '-') continue;

    questions.push({
      verb: verb,
      tenseKey: tense,
      tenseName: TENSE_LABELS_UR[tense],
      personIdx: personIdx,
      person: PERSONS_UR[personIdx],
      gender: gender,
      correctUrdu: ans.urdu,
      correctRoman: ans.roman,
      userAnswer: null,
      correct: null,
      attempts: 0
    });
  }

  if (questions.length === 0) {
    showNotification('Error', 'Could not generate questions. Try again.', 'info');
    return;
  }

  drillState = {
    type: 'quick',
    questions: questions,
    currentIdx: 0,
    startTime: Date.now(),
    streak: 0,
    score: 0
  };
  renderDrillQuestion_UR();
}

// ═══════════════════════════════════════════
// D) checkDrillAnswer
// ═══════════════════════════════════════════
function checkDrillAnswer_UR() {
  if (!drillState || drillState.currentIdx >= drillState.questions.length) return;
  var q = drillState.questions[drillState.currentIdx];
  if (q.correct === true) return;

  var input = document.getElementById('drillInput');
  var feedback = document.getElementById('drillFeedback');
  var buttons = document.getElementById('drillButtons');
  if (!input || !feedback || !buttons) return;

  var userVal = input.value.trim();
  if (!userVal) return;

  var isCorrect = normalizeUrduCompare(userVal, q.correctUrdu, q.correctRoman);
  q.attempts = (q.attempts || 0) + 1;

  if (isCorrect) {
    q.correct = true;
    q.userAnswer = userVal;
    drillState.streak++;
    drillState.score++;
    input.classList.remove('wrong');
    input.classList.add('correct');
    input.readOnly = true;

    var xpBase = XP_SOURCES_UR.quickDrill;
    var xp = addXP(xpBase, q.tenseKey, q.verb.cat);
    feedback.innerHTML = '<span class="drill-correct">\u2713 Correct!</span> <span class="drill-xp">+' + xp + ' XP</span>';
    feedback.innerHTML += '<div style="color:#888;font-size:.8em;margin-top:4px">' + escHtml_UR(q.correctUrdu) + ' (' + escHtml_UR(q.correctRoman) + ')</div>';
    if (q.attempts > 1) feedback.innerHTML += ' <span style="color:#888;font-size:.8em">(attempt ' + q.attempts + ')</span>';

    recordDrillAnswer(q.verb.inf, q.tenseKey, true);
    buttons.innerHTML = '<button class="drill-action-btn" onclick="advanceDrill_UR()">Next \u2192</button>';
  } else {
    drillState.streak = 0;
    input.classList.add('wrong');

    if (q.attempts >= 2) {
      q.correct = false;
      q.userAnswer = userVal;
      input.readOnly = true;
      feedback.innerHTML = '<span class="drill-wrong">\u2717 Incorrect.</span> Correct: <strong>' + escHtml_UR(q.correctUrdu) + '</strong> (' + escHtml_UR(q.correctRoman) + ')';
      recordDrillAnswer(q.verb.inf, q.tenseKey, false);
      buttons.innerHTML = '<button class="drill-action-btn" onclick="advanceDrill_UR()">Next \u2192</button>';
    } else {
      feedback.innerHTML = '<span class="drill-wrong">\u2717 Try Again</span>';
      buttons.innerHTML = '<button class="drill-action-btn drill-action-secondary" onclick="showDrillSolution_UR()" style="font-size:.8em">Show Answer</button> <button class="drill-action-btn drill-action-secondary" onclick="skipDrillQuestion_UR()" style="font-size:.8em">Skip \u2192</button>';
      setTimeout(function() {
        input.value = '';
        input.classList.remove('wrong');
        input.focus();
      }, 600);
    }
  }
}

function showDrillSolution_UR() {
  if (!drillState) return;
  var q = drillState.questions[drillState.currentIdx];
  var feedback = document.getElementById('drillFeedback');
  var input = document.getElementById('drillInput');
  var buttons = document.getElementById('drillButtons');
  if (!feedback || !input) return;

  q.correct = false;
  q.userAnswer = input.value || '(shown)';
  drillState.streak = 0;
  input.value = q.correctUrdu;
  input.readOnly = true;
  input.classList.remove('wrong');
  input.classList.add('shown');
  feedback.innerHTML = '<span class="drill-shown">Solution shown, no XP awarded</span>';
  feedback.innerHTML += '<div style="color:#888;font-size:.8em;margin-top:4px">' + escHtml_UR(q.correctUrdu) + ' (' + escHtml_UR(q.correctRoman) + ')</div>';
  recordDrillAnswer(q.verb.inf, q.tenseKey, false);

  if (buttons) {
    buttons.innerHTML = '<button class="drill-action-btn" onclick="advanceDrill_UR()">Next \u2192</button>';
  }
}

function skipDrillQuestion_UR() {
  if (!drillState) return;
  var q = drillState.questions[drillState.currentIdx];
  q.correct = false;
  q.userAnswer = '(skipped)';
  drillState.streak = 0;
  recordDrillAnswer(q.verb.inf, q.tenseKey, false);
  advanceDrill_UR();
}

function advanceDrill_UR() {
  if (!drillState) return;
  drillState.currentIdx++;
  renderDrillQuestion_UR();
}

  var urduForms = getVerbTense_UR(verb, tenseKey, gender);
  var romanForms = getVerbTenseRoman_UR(verb, tenseKey, gender);

  drillState = {
    type: 'fullTable',

    tenseKey: tenseKey,
    tenseName: TENSE_LABELS_UR[tenseKey],
    gender: gender,
    correctUrduForms: urduForms,
    correctRomanForms: romanForms,
    startTime: Date.now(),

// ═══════════════════════════════════════════
// H) checkFullTable
// ═══════════════════════════════════════════
function checkFullTable_UR() {
  if (!drillState || drillState.type !== 'fullTable') return;
  var correct = 0;
  var totalChecked = 0;

  PERSONS_UR.forEach(function(p, i) {
    if (drillState.answered[i]) return;
    var input = document.getElementById('ftInput' + i);
    var result = document.getElementById('ftResult' + i);
    if (!input || !result) return;

    var correctUrdu = drillState.correctUrduForms[i];
    var correctRoman = drillState.correctRomanForms[i];

    drillState.answered[i] = true;
    input.readOnly = true;

    // Skip '-' forms (e.g., imperative for main/I)
    if (correctUrdu === '-') {
      result.innerHTML = '<span class="drill-na">\u2014</span>';
      input.value = '\u2014';
      return;
    }

    totalChecked++;
    var userVal = input.value.trim();
    var isCorrect = normalizeUrduCompare(userVal, correctUrdu, correctRoman);

    if (isCorrect) {
      correct++;
      input.classList.add('correct');
      result.innerHTML = '<span class="drill-correct">\u2713</span>';
      recordDrillAnswer(drillState.verb.inf, drillState.tenseKey, true);
    } else {
      input.classList.add('wrong');
      result.innerHTML = '<span class="drill-wrong">\u2717 <span dir="rtl">' + escHtml_UR(correctUrdu) + '</span> (' + escHtml_UR(correctRoman) + ')</span>';
      recordDrillAnswer(drillState.verb.inf, drillState.tenseKey, false);
    }
  });

  if (correct > 0) addXP(correct * 10, drillState.tenseKey, drillState.verb.cat);

  if (conjProgress) {
    conjProgress.totalDrills++;
    conjProgress.fullTableDrills++;
    if (correct === totalChecked && totalChecked > 0) conjProgress.perfectDrills++;
    saveConjProgress();
    checkBadges();
  }

  // Campaign hook
  if (campaignMissionActive) {
    var campRatio = totalChecked > 0 ? correct / totalChecked : 0;
    setTimeout(function() { processCampaignResult(campRatio); }, 100);
  }

  var area = document.getElementById('drillArea');
  if (area) {
    var scoreDiv = document.createElement('div');
    scoreDiv.className = 'drill-ft-score';
    scoreDiv.innerHTML = '<strong>' + correct + '/' + totalChecked + ' correct</strong><br>';
    scoreDiv.innerHTML += '<button class="drill-action-btn" onclick="showFullTableSelection_UR()">New Table</button> ';
    scoreDiv.innerHTML += '<button class="drill-action-btn drill-action-secondary" onclick="renderDrillMenu()">Back</button>';
    area.appendChild(scoreDiv);
  }
}

// ═══════════════════════════════════════════
// I) startSpeedRound
// ═══════════════════════════════════════════
function startSpeedRound_UR() {
  if (speedRoundTimer) { clearInterval(speedRoundTimer); speedRoundTimer = null; }

  drillState = {
    type: 'speedRound',
    timeLeft: 60,
    totalAnswered: 0,
    totalCorrect: 0,
    startTime: Date.now(),
    currentQuestion: null,
    results: []
  };

  generateSpeedQuestion_UR();
  renderSpeedQuestion_UR();

  // Start countdown
  speedRoundTimer = setInterval(function() {
    if (!drillState || drillState.type !== 'speedRound') {
      clearInterval(speedRoundTimer);
      speedRoundTimer = null;
      return;
    }
    drillState.timeLeft--;
    var timerEl = document.getElementById('speedTimer');
    if (timerEl) {
      timerEl.textContent = drillState.timeLeft + 's';
      if (drillState.timeLeft <= 10) timerEl.style.color = '#e74c3c';
    }
    if (drillState.timeLeft <= 0) {
      endSpeedRound_UR();
    }
  }, 1000);
}

function generateSpeedQuestion_UR() {
  if (!drillState) return;
  var allTenses = Object.keys(TENSE_LABELS_UR);
  var verb, tense, personIdx, gender, ans;
  var attempts = 0;
  do {
    attempts++;
    verb = VERB_DATA_UR[Math.floor(Math.random() * VERB_DATA_UR.length)];
    tense = allTenses[Math.floor(Math.random() * allTenses.length)];
    personIdx = Math.floor(Math.random() * 6);
    gender = (tense === 'imper') ? null : (Math.random() < 0.5 ? 'm' : 'f');
    ans = getDrillAnswer_UR(verb, tense, personIdx, gender);
  } while ((!ans.urdu || ans.urdu === '-') && attempts < 50);

  drillState.currentQuestion = {
    verb: verb,
    tenseKey: tense,
    tenseName: TENSE_LABELS_UR[tense],
    personIdx: personIdx,
    person: PERSONS_UR[personIdx],
    gender: gender,
    correctUrdu: ans.urdu || '???',
    correctRoman: ans.roman || '???'
  };
}
