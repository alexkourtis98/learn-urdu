// ═══════════════════════════════════════════
// J) handleSpeedAnswer
// ═══════════════════════════════════════════
function handleSpeedAnswer_UR() {
  if (!drillState || drillState.type !== 'speedRound' || drillState.timeLeft <= 0) return;

  var input = document.getElementById('speedInput');
  var feedback = document.getElementById('speedFeedback');
  if (!input || !feedback) return;

  var userVal = input.value.trim();
  if (!userVal) return;

  var q = drillState.currentQuestion;
  var isCorrect = normalizeUrduCompare(userVal, q.correctUrdu, q.correctRoman);

  drillState.totalAnswered++;
  input.readOnly = true;

  drillState.results.push({
    verb: q.verb,
    tenseKey: q.tenseKey,
    tenseName: q.tenseName,
    person: q.person,
    gender: q.gender,
    correctUrdu: q.correctUrdu,
    correctRoman: q.correctRoman,
    userAnswer: userVal,
    correct: isCorrect
  });

  recordDrillAnswer(q.verb.inf, q.tenseKey, isCorrect);

  if (isCorrect) {
    drillState.totalCorrect++;
    var xp = addXP(8, q.tenseKey, q.verb.cat);
    input.classList.add('correct');
    feedback.innerHTML = '<span class="drill-correct">\u2713</span> <span class="drill-xp">+' + xp + '</span>';
    // Auto-advance quickly
    setTimeout(function() {
      if (drillState && drillState.type === 'speedRound' && drillState.timeLeft > 0) {
        generateSpeedQuestion_UR();
        renderSpeedQuestion_UR();
      }
    }, 300);
  } else {
    input.classList.add('wrong');
    feedback.innerHTML = '<span class="drill-wrong">\u2717</span> <strong dir="rtl">' + escHtml_UR(q.correctUrdu) + '</strong> (' + escHtml_UR(q.correctRoman) + ')';
    // Brief pause then next
    setTimeout(function() {
      if (drillState && drillState.type === 'speedRound' && drillState.timeLeft > 0) {
        generateSpeedQuestion_UR();
        renderSpeedQuestion_UR();
      }
    }, 500);
  }
}

  if (speedRoundTimer) { clearInterval(speedRoundTimer); speedRoundTimer = null; }

      html += '<td>' + (r.correct ? '\u2713' : '\u2717') + '</td>';
      html += '</tr>';
    });

  html += '<div class="drill-actions">';

function vtSelectMode_UR(el, mode) {
  document.querySelectorAll('.vt-mode-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  var groupOpts = document.getElementById('vtGroupOpts_UR');
  var randomOpts = document.getElementById('vtRandomOpts_UR');
  if (groupOpts) groupOpts.style.display = mode === 'group' ? 'block' : 'none';
  if (randomOpts) randomOpts.style.display = mode === 'random' ? 'block' : 'none';
}

function startVisualTableDrill_UR(verbInf, mode, options) {
  var verb;
  var genderChoice;

  if (verbInf) {
    verb = VERB_DATA_UR.find(function(v) { return v.inf === verbInf; });
    if (!verb) return;
    mode = mode || 'full';
    options = options || {};
    genderChoice = (options && options.gender) ? options.gender : 'both';
  } else if (vtState && vtState.verb) {
    verb = vtState.verb;
    mode = vtState.mode || 'full';
    options = vtState.options || {};
    genderChoice = vtState.genderChoice || 'both';
  } else {
    var vtVerbEl = document.getElementById('vtVerb_UR');
    if (!vtVerbEl) return;
    verbInf = vtVerbEl.value;
    verb = VERB_DATA_UR.find(function(v) { return v.inf === verbInf; });
    if (!verb) return;
    var modeEl = document.querySelector('.vt-mode-btn.active');
    mode = modeEl ? modeEl.dataset.mode : 'full';
    options = {};
    if (mode === 'group') {
      options.groupIdx = parseInt(document.getElementById('vtGroup_UR').value);
    } else if (mode === 'random') {
      options.blankPct = parseFloat(document.getElementById('vtDifficulty_UR').value);
    }
    var genderEl = document.getElementById('vtGender_UR');
    genderChoice = genderEl ? genderEl.value : 'both';
  }

  vtState = {
    verb: verb,
    mode: mode,
    options: options,
    genderChoice: genderChoice,
    checked: false,
    startTime: Date.now()
  };

  renderVisualTable_UR();
}

// ═══════════════════════════════════════════
// M) renderVisualTable
// ═══════════════════════════════════════════
function renderVisualTable_UR() {
  var area = document.getElementById('drillArea');
  if (!area || !vtState) return;

  var verb = vtState.verb;
  var mode = vtState.mode;
  var options = vtState.options;
  var genderChoice = vtState.genderChoice;

  // Determine which tense groups to show
  var groups;
  if (mode === 'group') {
    groups = [TENSE_GROUPS_UR[options.groupIdx]];
  } else {
    groups = TENSE_GROUPS_UR;
  }

  // Determine genders to render
  var genders;
  if (genderChoice === 'both') {
    genders = ['m', 'f'];
  } else {
    genders = [genderChoice];
  }

  // For random blanks, pre-compute which cells are blanked
  var blankedCells = {};
  if (mode === 'random') {
    groups.forEach(function(group) {
      group.tenses.forEach(function(tenseKey) {
        genders.forEach(function(g) {
          for (var pi = 0; pi < 6; pi++) {
            if (tenseKey === 'imper' && pi === 0) continue; // main has no imperative
            var cellId = tenseKey + '_' + g + '_' + pi;
            blankedCells[cellId] = Math.random() < options.blankPct;
          }
        });
      });
    });
  }

  var html = '';

  // Verb header
  html += '<div class="vt-verb-header">';
  html += '<h3>' + escHtml_UR(verb.inf) + '</h3>';
  html += '<div class="vt-meta">';
  html += '<span><b>English:</b> ' + escHtml_UR(verb.en) + '</span>';
  html += '<span><b>Stem:</b> ' + escHtml_UR(verb.stem) + '</span>';
  html += '<span><b>Category:</b> ' + escHtml_UR(CAT_LABELS_UR[verb.cat] || verb.cat) + '</span>';
  html += '</div></div>';

  html += '<div class="conj-tenses-grid">';

  var tabIdx = 1;
  var totalInputs = 0;

  groups.forEach(function(group) {
    html += '<div class="conj-tense-group-label">' + escHtml_UR(group.label) + '</div>';

    group.tenses.forEach(function(tenseKey) {
      var isImperative = (tenseKey === 'imper');

      if (isImperative) {
        // Imperative has no gender, single table
        var urduForms = verb.conj.imper.forms;
        var romanForms = verb.conj.imper.roman;
        if (!urduForms) return;

        html += '<div class="conj-tense-card">';
        html += '<h4>' + escHtml_UR(TENSE_LABELS_UR[tenseKey]) + '</h4>';
        html += '<table class="conj-tense-table">';

        PERSONS_UR.forEach(function(person, pi) {
          var form = urduForms[pi];
          var roman = romanForms[pi];
          var cellId = tenseKey + '_none_' + pi;

          if (pi === 0 && form === '-') {
            html += '<tr><td>' + escHtml_UR(person) + '</td><td style="color:#555;">\u2014</td></tr>';
            return;
          }

          var isBlank;
          if (mode === 'random') {
            isBlank = blankedCells[tenseKey + '_m_' + pi] !== undefined ? blankedCells[tenseKey + '_m_' + pi] : true;
          } else {
            isBlank = true;
          }

          html += '<tr><td>' + escHtml_UR(person) + '</td><td>';
          if (isBlank) {
            html += '<input type="text" class="vt-input" data-answer-urdu="' + escAttr_UR(form) + '" data-answer-roman="' + escAttr_UR(roman) + '" data-tense="' + tenseKey + '" data-pidx="' + pi + '" data-gender="none" tabindex="' + tabIdx + '" autocomplete="off" spellcheck="false" dir="auto">';
            html += '<div class="vt-correct-answer"></div>';
            tabIdx++;
            totalInputs++;
          } else {
            html += '<span class="vt-given-form" style="color:#888;" dir="rtl">' + escHtml_UR(form) + '</span> <span style="color:#666;font-size:.8em">(' + escHtml_UR(roman) + ')</span>';
          }
          html += '</td></tr>';
        });

        html += '</table></div>';
      } else {
        // Non-imperative: render per gender
        genders.forEach(function(g) {
          var urduForms = getVerbTense_UR(verb, tenseKey, g);
          var romanForms = getVerbTenseRoman_UR(verb, tenseKey, g);
          if (!urduForms) return;

          var genderLabel = g === 'm' ? 'مذکر (M)' : 'مؤنث (F)';
          html += '<div class="conj-tense-card">';
          html += '<h4>' + escHtml_UR(TENSE_LABELS_UR[tenseKey]) + ' \u2014 ' + genderLabel + '</h4>';
          html += '<table class="conj-tense-table">';

          PERSONS_UR.forEach(function(person, pi) {
            var form = urduForms[pi];
            var roman = romanForms[pi];
            var cellId = tenseKey + '_' + g + '_' + pi;

            var isBlank;
            if (mode === 'random') {
              isBlank = blankedCells[cellId];
            } else {
              isBlank = true;
            }

            html += '<tr><td>' + escHtml_UR(person) + '</td><td>';
            if (isBlank) {
              html += '<input type="text" class="vt-input" data-answer-urdu="' + escAttr_UR(form) + '" data-answer-roman="' + escAttr_UR(roman) + '" data-tense="' + tenseKey + '" data-pidx="' + pi + '" data-gender="' + g + '" tabindex="' + tabIdx + '" autocomplete="off" spellcheck="false" dir="auto">';
              html += '<div class="vt-correct-answer"></div>';
              tabIdx++;
              totalInputs++;
            } else {
              html += '<span class="vt-given-form" style="color:#888;" dir="rtl">' + escHtml_UR(form) + '</span> <span style="color:#666;font-size:.8em">(' + escHtml_UR(roman) + ')</span>';
            }
            html += '</td></tr>';
          });

          html += '</table></div>';
        });
      }
    });
  });

  html += '</div>'; // end conj-tenses-grid

  // Check bar
  html += '<div class="vt-check-bar" id="vtCheckBar_UR">';
  html += '<div class="vt-progress"><strong id="vtFilled_UR">0</strong> / <strong>' + totalInputs + '</strong> filled</div>';
  html += '<button class="vt-check-btn" id="vtCheckBtn_UR" onclick="checkVisualTable_UR()">Check All</button>';
  html += '</div>';

  area.innerHTML = html;
  vtState.totalInputs = totalInputs;

  // Track filled count
  var inputs = area.querySelectorAll('.vt-input');
  inputs.forEach(function(inp) {
    inp.addEventListener('input', function() {
      var allVtInputs = area.querySelectorAll('.vt-input');
      var filled = 0;
      allVtInputs.forEach(function(el) { if (el.value.trim() !== '') filled++; });
      var filledEl = document.getElementById('vtFilled_UR');
      if (filledEl) filledEl.textContent = filled;
    });
    // Enter moves to next input
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var allInputs = Array.from(area.querySelectorAll('.vt-input'));
        var idx = allInputs.indexOf(e.target);
        if (idx < allInputs.length - 1) {
          allInputs[idx + 1].focus();
        } else {
          var checkBtn = document.getElementById('vtCheckBtn_UR');
          if (checkBtn) checkBtn.focus();
        }
      }
    });
  });

  // Focus first input
  var firstInput = area.querySelector('.vt-input');
  if (firstInput) firstInput.focus();
}

// ═══════════════════════════════════════════
// N) checkVisualTable
// ═══════════════════════════════════════════
function checkVisualTable_UR() {
  var area = document.getElementById('drillArea');
  if (!area || !vtState || vtState.checked) return;
  vtState.checked = true;

  var inputs = area.querySelectorAll('.vt-input');
  var correct = 0;
  var total = inputs.length;
  var totalXP = 0;

  inputs.forEach(function(inp) {
    var answerUrdu = inp.dataset.answerUrdu;
    var answerRoman = inp.dataset.answerRoman;
    var tenseKey = inp.dataset.tense;
    var userVal = inp.value.trim();

    var isCorrect = false;
    if (userVal !== '') {
      isCorrect = normalizeUrduCompare(userVal, answerUrdu, answerRoman);
    }

    inp.readOnly = true;
    if (isCorrect) {
      correct++;
      inp.classList.add('correct');
      recordDrillAnswer(vtState.verb.inf, tenseKey, true);
      var xp = addXP(5, tenseKey, vtState.verb.cat);
      totalXP += xp;
    } else {
      inp.classList.add('wrong');
      recordDrillAnswer(vtState.verb.inf, tenseKey, false);
      // Show correct answer
      var reveal = inp.parentElement.querySelector('.vt-correct-answer');
      if (reveal) {
        reveal.innerHTML = '\u2192 <span dir="rtl">' + escHtml_UR(answerUrdu) + '</span> (' + escHtml_UR(answerRoman) + ')';
        reveal.classList.add('show');
      }
    }
  });

  // Update drill count
  if (conjProgress) {
    conjProgress.totalDrills++;
    if (correct === total && total > 0) conjProgress.perfectDrills = (conjProgress.perfectDrills || 0) + 1;
    saveConjProgress();
    checkBadges();
  }

  // Hide check bar
  var checkBar = document.getElementById('vtCheckBar_UR');
  if (checkBar) checkBar.style.display = 'none';

  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  var resultsHtml = '<div class="vt-results-bar">';
  resultsHtml += '<div class="vt-score">' + correct + ' / ' + total + '<span class="vt-pct">' + pct + '%</span></div>';
  resultsHtml += '<div class="vt-xp">+' + totalXP + ' XP earned</div>';
  resultsHtml += '<div class="vt-results-actions">';
  resultsHtml += '<button class="vt-retry-btn" onclick="startVisualTableDrill_UR()">Try Again</button>';
  resultsHtml += '<button class="vt-back-btn" onclick="renderDrillMenu()">Back to Drills</button>';
  resultsHtml += '</div></div>';

  // Insert results at top
  area.insertAdjacentHTML('afterbegin', resultsHtml);

  // Scroll to top
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });

  if (typeof updateXPDisplay === 'function') updateXPDisplay();

  // Campaign hook
  if (campaignMissionActive) {
    var campRatio = total > 0 ? correct / total : 0;
    setTimeout(function() { processCampaignResult(campRatio); }, 100);
  }
}

// ═══════════════════════════════════════════
// O) startRandomChallenge
// ═══════════════════════════════════════════
function startRandomChallenge_UR() {
  var now = Date.now();
  var cooldownMs = 60000;
  if (now - randomChallengeLastTime_UR < cooldownMs) {
    var remaining = Math.ceil((cooldownMs - (now - randomChallengeLastTime_UR)) / 1000);
    showNotification('Cooldown', 'Random Challenge available in ' + remaining + 's', 'info');
    return;
  }

  // Pick a random drill type
  var drillTypes = ['quick', 'fullTable', 'speed', 'visual', 'single'];
  var chosen = drillTypes[Math.floor(Math.random() * drillTypes.length)];

  randomChallengeLastTime_UR = now;

  switch (chosen) {
    case 'quick':
      startQuickDrill_UR({ count: 10 });
      break;
    case 'fullTable':
      // Pick random verb and tense
      var verb = VERB_DATA_UR[Math.floor(Math.random() * VERB_DATA_UR.length)];
      var allTenses = Object.keys(TENSE_LABELS_UR);
      var tense = allTenses[Math.floor(Math.random() * allTenses.length)];
      startFullTableDrill_UR(verb.inf, tense);
      break;
    case 'speed':
      startSpeedRound_UR();
      break;
    case 'visual':
      var rVerb = VERB_DATA_UR[Math.floor(Math.random() * VERB_DATA_UR.length)];
      startVisualTableDrill_UR(rVerb.inf, 'full', { gender: 'both' });
      break;
    case 'single':
    default:
      // Single random question challenge (like Spanish randomChallenge)
      startSingleRandomChallenge_UR();
      break;
  }
}

function startSingleRandomChallenge_UR() {
  var allTenses = Object.keys(TENSE_LABELS_UR);
  var verb, tense, personIdx, gender, ans;
  var attempts = 0;
  do {
    attempts++;
    verb = VERB_DATA_UR[Math.floor(Math.random() * VERB_DATA_UR.length)];
    tense = allTenses[Math.floor(Math.random() * allTenses.length)];
    personIdx = Math.floor(Math.random() * 6);
    gender = (tense === 'imper') ? null : (Math.random() < 0.5 ? 'm' : 'f');
    ans = getDrillAnswer_UR(verb, tense, personIdx, gender);
  } while ((!ans.urdu || ans.urdu === '-') && attempts < 50);

  if (!ans.urdu || ans.urdu === '-') return;

  drillState = {
    type: 'random',
    verb: verb,
    tenseKey: tense,
    tenseName: TENSE_LABELS_UR[tense],
    personIdx: personIdx,
    person: PERSONS_UR[personIdx],
    gender: gender,
    correctUrdu: ans.urdu,
    correctRoman: ans.roman,
    startTime: Date.now(),
    answered: false
  };

  renderSingleRandomChallenge_UR();
}

function renderSingleRandomChallenge_UR() {
  var area = document.getElementById('drillArea');
  if (!area || !drillState || drillState.type !== 'random') return;

  var catLabel = CAT_LABELS_UR[drillState.verb.cat] || drillState.verb.cat;

  var html = '<div class="drill-random">';
  html += '<h3>\u26A1 Random Challenge</h3>';
  html += '<p class="drill-random-subtitle">Answer quickly for bonus XP!</p>';
  html += '<div class="drill-question-card drill-random-card">';
  html += '<div class="drill-verb">' + escHtml_UR(drillState.verb.inf) + ' <span class="drill-verb-en">(' + escHtml_UR(drillState.verb.en) + ')</span></div>';
  html += '<div style="margin:4px 0"><span style="font-size:.7em;color:#888;background:rgba(192,57,43,.15);padding:2px 8px;border-radius:10px">' + escHtml_UR(catLabel) + '</span></div>';

  // Gender badge
  if (drillState.gender) {
    html += '<div style="margin:4px 0">' + genderBadgeHTML_UR(drillState.gender) + '</div>';
  }

  html += '<div class="drill-tense">' + escHtml_UR(drillState.tenseName) + '</div>';
  html += '<div class="drill-person">' + escHtml_UR(drillState.person) + '</div>';
  html += '<div class="drill-input-row">';
  html += '<input type="text" id="drillInput" class="drill-input" placeholder="Quick!" autocomplete="off" autofocus dir="auto">';
  html += '<button class="drill-check-btn" onclick="checkSingleRandomChallenge_UR()">Go!</button>';
  html += '</div>';
  html += '<div class="drill-feedback" id="drillFeedback"></div>';
  html += '</div></div>';

  area.innerHTML = html;
  var input = document.getElementById('drillInput');
  if (input) {
    input.focus();
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkSingleRandomChallenge_UR();
    });
  }
}

function checkSingleRandomChallenge_UR() {
  if (!drillState || drillState.type !== 'random' || drillState.answered) return;
  var input = document.getElementById('drillInput');
  var feedback = document.getElementById('drillFeedback');
  if (!input || !feedback) return;
  var userVal = input.value.trim();
  if (!userVal) return;

  drillState.answered = true;
  var elapsed = (Date.now() - drillState.startTime) / 1000;
  var isCorrect = normalizeUrduCompare(userVal, drillState.correctUrdu, drillState.correctRoman);
  input.readOnly = true;

  if (isCorrect) {
    input.classList.add('correct');
    var baseXP = XP_SOURCES_UR.randomChallenge;
    if (elapsed < 5) baseXP = Math.round(baseXP * 2);
    var xp = addXP(baseXP, drillState.tenseKey, drillState.verb.cat);
    feedback.innerHTML = '<span class="drill-correct">\u2713 Correct!</span> +' + xp + ' XP';
    if (elapsed < 5) feedback.innerHTML += ' <span class="drill-speed-bonus">(Speed Bonus!)</span>';
    feedback.innerHTML += '<br><span class="drill-time">Time: ' + elapsed.toFixed(1) + 's</span>';
    feedback.innerHTML += '<div style="color:#888;font-size:.8em;margin-top:4px">' + escHtml_UR(drillState.correctUrdu) + ' (' + escHtml_UR(drillState.correctRoman) + ')</div>';
  } else {
    input.classList.add('wrong');
    feedback.innerHTML = '<span class="drill-wrong">\u2717 Incorrect.</span> Correct: <strong dir="rtl">' + escHtml_UR(drillState.correctUrdu) + '</strong> (' + escHtml_UR(drillState.correctRoman) + ')';
  }

  recordDrillAnswer(drillState.verb.inf, drillState.tenseKey, isCorrect);
  if (conjProgress) { conjProgress.totalDrills++; saveConjProgress(); checkBadges(); }

  feedback.innerHTML += '<div class="drill-actions" style="margin-top:12px"><button class="drill-action-btn" onclick="startRandomChallenge_UR()">Another Challenge</button> <button class="drill-action-btn drill-action-secondary" onclick="renderDrillMenu()">Back</button></div>';
  drillState = null;
}

// === URDU CAMPAIGN MODE FUNCTIONS ===
// Adapted from Spanish portal reference implementation
// Depends on: staging-data.js (CAMPAIGN_CHAPTERS_UR, CAMPAIGN_MISSIONS_UR, VERB_DATA_UR,
//   TENSE_LABELS_UR, PERSONS_UR, XP_SOURCES_UR, getVerbTense_UR, getVerbTenseRoman_UR)
// Globals assumed: conjProgress, drillState, speedRoundTimer, campaignMissionActive
// Functions assumed: addXP, saveConjProgress, checkBadges, showNotification,
//   renderDrillMenu, switchConjTab, renderDrillQuestion, renderSpeedQuestion,
//   endSpeedRound, startFullTableDrill, normalizeUrduCompare

// ─── P) getCampaignVerbPool ───

var getCampaignVerbPool = function(mission) {
  if (mission.verbs) {
    return VERB_DATA_UR.filter(function(v) { return mission.verbs.indexOf(v.inf) >= 0; });
  }
  // For missions with verbs: null, scope by chapter category
  var catMap = {
    1: "irregular",        // hona basics
    2: "regular-trans",    // regular transitive, present habitual
    3: null,               // past simple, all verbs
    4: null,               // future, all verbs
    5: "regular-intrans",  // intransitive + present continuous
    6: null,               // imperative, all verbs
    7: null,               // gender drills, all verbs
    8: null                // final battle, all verbs
  };
  var cat = catMap[mission.chapter];
  if (cat) {
    return VERB_DATA_UR.filter(function(v) { return v.cat === cat; });
  }
  return VERB_DATA_UR.slice();
};

// ─── O) getCampaignTensePool ───

var getCampaignTensePool = function(mission) {
  if (mission.tenses) return mission.tenses.slice();
  return Object.keys(TENSE_LABELS_UR);
};

// ─── D) getMissionState ───

var getMissionState = function(mission, cp) {
  if (!mission) return 'locked';
  var mdata = cp.missions[mission.id];
  if (mdata && mdata.completed) return 'completed';
  // Check all prereqs are completed
  for (var i = 0; i < mission.prereqs.length; i++) {
    var prereq = cp.missions[mission.prereqs[i]];
    if (!prereq || !prereq.completed) return 'locked';
  }
  // Check chapter accessibility
  if (mission.chapter > (cp.currentChapter || 1)) return 'locked';
  return 'available';
};

// ─── C) calculateNodePositions ───

var calculateNodePositions = function(missions) {
  var nodes = {};
  var mainX = 200;
  var sideX = 330;
  var startY = 40;
  var gapY = 70;
  var mainIdx = 0;

  var mainMissions = missions.filter(function(m) { return !m.isSide; });
  var sideMissions = missions.filter(function(m) { return m.isSide; });

  // Zigzag for main path
  mainMissions.forEach(function(m, idx) {
    var xOffset = (idx % 2 === 0) ? -20 : 20;
    nodes[m.id] = { x: mainX + xOffset, y: startY + idx * gapY };
    mainIdx = idx + 1;
  });

  // Side missions branch from their prereq
  sideMissions.forEach(function(m) {
    if (m.prereqs.length > 0 && nodes[m.prereqs[0]]) {
      var parentPos = nodes[m.prereqs[0]];
      nodes[m.id] = { x: sideX, y: parentPos.y + gapY * 0.5 };
    } else {
      nodes[m.id] = { x: sideX, y: startY + mainIdx * gapY };
      mainIdx++;
    }
  });

  var maxY = 0;
  for (var id in nodes) {
    if (nodes[id].y > maxY) maxY = nodes[id].y;
  }

  return { nodes: nodes, maxY: maxY };
};

// ─── F) renderHexagon ───

var renderHexagon = function(cx, cy, r, fill, stroke) {
  var points = [];
  for (var i = 0; i < 6; i++) {
    var angle = (Math.PI / 3) * i - Math.PI / 2;
    points.push((cx + r * Math.cos(angle)).toFixed(1) + ',' + (cy + r * Math.sin(angle)).toFixed(1));
  }
  return '<polygon class="campaign-node-circle" points="' + points.join(' ') + '" fill="' + fill + '" stroke="' + stroke + '"/>';
};

// ─── G) renderDiamond ───

var renderDiamond = function(cx, cy, r, fill, stroke) {
  var s = r * 0.85;
  var points = cx + ',' + (cy - s) + ' ' + (cx + s) + ',' + cy + ' ' + cx + ',' + (cy + s) + ' ' + (cx - s) + ',' + cy;
  return '<polygon class="campaign-node-circle" points="' + points + '" fill="' + fill + '" stroke="' + stroke + '"/>';
};

// ─── H) renderStars ───

var renderStars = function(cx, cy, earned, max) {
  if (typeof max === 'undefined') max = 3;
  var html = '';
  var starSpacing = 12;
  var startX = cx - starSpacing;
  for (var i = 0; i < max; i++) {
    var cls = i < earned ? 'campaign-star' : 'campaign-star empty';
    html += '<text class="' + cls + '" x="' + (startX + i * starSpacing) + '" y="' + cy + '">' + (i < earned ? '\u2605' : '\u2606') + '</text>';
  }
  return html;
};

// ─── E) renderMapNode ───

var renderMapNode = function(mission, pos, state, mdata, chapterColor) {
  var r = mission.isBoss ? 22 : 16;
  var fill, stroke, textColor;

  switch (state) {
    case 'completed':
      fill = mdata && mdata.stars >= 3 ? '#f39c12' : '#2ecc71';
      stroke = mdata && mdata.stars >= 3 ? '#e67e22' : '#27ae60';
      textColor = '#fff';
      break;
    case 'available':
      fill = '#1a1a2e';
      stroke = chapterColor;
      textColor = '#e0e0e0';
      break;
    default:
      fill = '#222';
      stroke = '#444';
      textColor = '#666';
  }

  var nodeClass = 'campaign-node ' + state;
  if (mission.isBoss) nodeClass += ' boss';

  var html = '<g class="' + nodeClass + '" style="--glow-color:' + chapterColor + '" ' +
    (state !== 'locked' ? 'onclick="showMissionBrief(\'' + mission.id + '\')"' : '') + '>';

  // Shape: hexagon for boss, diamond for side, circle for standard
  if (mission.isBoss) {
    html += renderHexagon(pos.x, pos.y, r, fill, stroke);
  } else if (mission.isSide) {
    html += renderDiamond(pos.x, pos.y, r, fill, stroke);
  } else {
    html += '<circle class="campaign-node-circle" cx="' + pos.x + '" cy="' + pos.y + '" r="' + r + '" fill="' + fill + '" stroke="' + stroke + '"/>';
  }

  // Type icon inside node
  var typeIcons = { standard: '\uD83C\uDFAF', speed: '\u23F1', endurance: '\uD83D\uDCAA', table: '\uD83D\uDCCA', boss: '\uD83D\uDC51', gauntlet: '\u26A1' };
  var icon = mission.isBoss ? typeIcons.boss : (typeIcons[mission.type] || typeIcons.standard);
  if (state !== 'locked') {
    html += '<text x="' + pos.x + '" y="' + (pos.y + 4) + '" text-anchor="middle" fill="' + textColor + '" font-size="' + (mission.isBoss ? 14 : 11) + '">' + icon + '</text>';
  }

  // Label below node (Urdu title)
  var labelY = pos.y + r + 14;
  var truncTitle = mission.title.length > 18 ? mission.title.substring(0, 16) + '..' : mission.title;
  html += '<text class="campaign-node-label" x="' + pos.x + '" y="' + labelY + '">' + truncTitle + '</text>';

  // Side mission indicator
  if (mission.isSide) {
    html += '<text class="campaign-side-label" x="' + pos.x + '" y="' + (labelY + 10) + '">(optional)</text>';
  }

  // Stars below completed nodes
  if (state === 'completed' && mdata) {
    html += renderStars(pos.x, labelY + (mission.isSide ? 18 : 10), mdata.stars, 3);
  }

  // Checkmark for completed
  if (state === 'completed') {
    html += '<text x="' + (pos.x + r - 2) + '" y="' + (pos.y - r + 6) + '" fill="#2ecc71" font-size="10" font-weight="bold">\u2713</text>';
  }

  html += '</g>';
  return html;
};

// ─── Q) renderCampaignConnections ───

var renderCampaignConnections = function(missions, positions, cp) {
  var html = '';
  missions.forEach(function(m) {
    var pos = positions.nodes[m.id];
    if (!pos) return;
    m.prereqs.forEach(function(prereqId) {
      var prereqPos = positions.nodes[prereqId];
      if (!prereqPos) return;
      var prereqMission = CAMPAIGN_MISSIONS_UR.find(function(pm) { return pm.id === prereqId; });
      var prereqState = getMissionState(prereqMission, cp);
      var mState = getMissionState(m, cp);
      var lineClass = 'campaign-connection';
      if (prereqState === 'completed' && mState === 'completed') lineClass += ' completed';
      else if (prereqState === 'completed') lineClass += ' unlocked';
      else lineClass += ' locked';

      // Curved path for side missions, straight for main path
      if (m.isSide) {
        var midX = (prereqPos.x + pos.x) / 2;
        var midY = (prereqPos.y + pos.y) / 2;
        var cpx = midX + 20;
        var cpy = midY;
        html += '<path d="M' + prereqPos.x + ',' + prereqPos.y + ' Q' + cpx + ',' + cpy + ' ' + pos.x + ',' + pos.y + '" class="' + lineClass + '"/>';
      } else {
        html += '<line x1="' + prereqPos.x + '" y1="' + prereqPos.y + '" x2="' + pos.x + '" y2="' + pos.y + '" class="' + lineClass + '"/>';
      }
    });
  });
  return html;
};

// ─── B) renderChapterSection ───

var renderChapterSection = function(chapter, missions, cp) {
  var chapterAccessible = chapter.id <= (cp.currentChapter || 1);
  var completedInChapter = missions.filter(function(m) { return cp.missions[m.id] && cp.missions[m.id].completed; }).length;

  var html = '<div class="campaign-chapter' + (chapterAccessible ? '' : ' locked') + '">';
  html += '<div class="campaign-chapter-header" style="--ch-color:' + chapter.color + ';border-left-color:' + chapter.color + '">';
  html += '<span class="campaign-chapter-icon">' + chapter.icon + '</span>';
  html += '<div><div class="campaign-chapter-name">Ch.' + chapter.id + ': ' + chapter.name + '</div>';
  html += '<div class="campaign-chapter-desc">' + chapter.desc + '</div></div>';
  html += '<span class="campaign-chapter-progress">' + completedInChapter + '/' + missions.length + '</span>';
  html += '</div>';

  if (!chapterAccessible) {
    html += '</div>';
    return html;
  }

  // SVG node map
  var positions = calculateNodePositions(missions);
  var svgHeight = positions.maxY + 60;
  html += '<svg class="campaign-map-svg" viewBox="0 0 420 ' + svgHeight + '" style="height:' + svgHeight + 'px;max-height:' + svgHeight + 'px">';

  // Draw connections first (behind nodes)
  html += renderCampaignConnections(missions, positions, cp);

  // Draw nodes
  missions.forEach(function(m) {
    var pos = positions.nodes[m.id];
    if (!pos) return;
    var state = getMissionState(m, cp);
    var mdata = cp.missions[m.id];
    html += renderMapNode(m, pos, state, mdata, chapter.color);
  });

  html += '</svg></div>';
  return html;
};

// ─── A) renderCampaignMap ───

var renderCampaignMap = function() {
  var area = document.getElementById('campaignArea');
  if (!area) return;
  if (!conjProgress) initConjProgress();
  if (!conjProgress.campaign) conjProgress.campaign = { missions: {}, totalStars: 0, completedCount: 0, currentChapter: 1 };
  var cp = conjProgress.campaign;

  var totalMissions = CAMPAIGN_MISSIONS_UR.length;
  var totalPossibleStars = totalMissions * 3;

  var html = '<div class="campaign-header">';
  html += '<h3>\u2694\uFE0F \u0641\u0639\u0644 \u06A9\u06CC \u0641\u062A\u062D</h3>';
  html += '<div class="campaign-header-stats">';
  html += '<div class="campaign-header-stat">\u2B50 \u0633\u062A\u0627\u0631\u06D2: <span class="stat-val">' + cp.totalStars + '/' + totalPossibleStars + '</span></div>';
  html += '<div class="campaign-header-stat">\u2705 \u0645\u0634\u0646: <span class="stat-val">' + cp.completedCount + '/' + totalMissions + '</span></div>';
  html += '<div class="campaign-header-stat">\uD83D\uDCD6 \u0628\u0627\u0628: <span class="stat-val">' + cp.currentChapter + '/' + CAMPAIGN_CHAPTERS_UR.length + '</span></div>';
  html += '</div></div>';

  CAMPAIGN_CHAPTERS_UR.forEach(function(chapter) {
    var chMissions = CAMPAIGN_MISSIONS_UR.filter(function(m) { return m.chapter === chapter.id; });

// ─── I) showMissionBrief ───

var showMissionBrief = function(missionId) {
  var area = document.getElementById('campaignArea');
  if (!area) return;
  var mission = CAMPAIGN_MISSIONS_UR.find(function(m) { return m.id === missionId; });
  if (!mission) return;
  var chapter = CAMPAIGN_CHAPTERS_UR.find(function(c) { return c.id === mission.chapter; });
  if (!conjProgress) initConjProgress();
  var cp = conjProgress.campaign || { missions: {}, totalStars: 0, completedCount: 0, currentChapter: 1 };
  var mdata = cp.missions[mission.id];

  var html = '<div class="campaign-brief">';
  html += '<button class="campaign-brief-back" onclick="renderCampaignMap()">\u2190 \u0646\u0642\u0634\u06D2 \u067E\u0631 \u0648\u0627\u067E\u0633</button>';
  html += '<div class="campaign-brief-header" style="border-color:' + chapter.color + '">';
  html += '<div class="campaign-brief-chapter" style="color:' + chapter.color + '">\u0628\u0627\u0628 ' + mission.chapter + ': ' + chapter.name + '</div>';
  html += '<h3 class="campaign-brief-title">' + (mission.isBoss ? '\uD83D\uDC51 ' : '') + mission.title + '</h3>';
  html += '<p class="campaign-brief-desc">' + mission.desc + '</p>';
  html += '</div>';

  // Mission info grid
  html += '<div class="campaign-brief-info">';
  var typeLabels = {
    standard: "\u0639\u0627\u0645 \u0645\u0634\u0646",
    speed: "\u0631\u0641\u062A\u0627\u0631 \u0686\u06CC\u0644\u0646\u062C",
    endurance: "\u0628\u0631\u062F\u0627\u0634\u062A",
    table: "\u0645\u06A9\u0645\u0644 \u062C\u062F\u0648\u0644",
    boss: "\u0628\u0627\u0633 \u0628\u06CC\u0679\u0644",
    gauntlet: "\u0622\u062E\u0631\u06CC \u0645\u0639\u0631\u06A9\u06C1"
  };
  html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">\u0642\u0633\u0645</span><span class="campaign-brief-value">' + (typeLabels[mission.type] || mission.type) + '</span></div>';
  html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">\u067E\u0627\u0633</span><span class="campaign-brief-value">' + Math.round(mission.passThreshold * 100) + '%</span></div>';
  html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">\u0633\u062A\u0627\u0631\u06D2</span><span class="campaign-brief-value">' + mission.starThresholds.map(function(t) { return Math.round(t * 100) + '%'; }).join(' / ') + '</span></div>';
  html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">\u0628\u0648\u0646\u0633 XP</span><span class="campaign-brief-value">+' + mission.xpBonus + '</span></div>';

  if (mission.verbs) {
    html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">\u0641\u0639\u0644</span><span class="campaign-brief-value">' + mission.verbs.join(', ') + '</span></div>';
  }
  if (mission.tenses) {
    html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">\u0632\u0645\u0627\u0646\u06D2</span><span class="campaign-brief-value">' + mission.tenses.map(function(t) { return TENSE_LABELS_UR[t] || t; }).join(', ') + '</span></div>';
  }
  html += '</div>';

  // Best result
  if (mdata && mdata.completed) {
    html += '<div class="campaign-brief-best">';
    html += '<div class="campaign-brief-best-title">\u0628\u06C1\u062A\u0631\u06CC\u0646 \u0646\u062A\u06CC\u062C\u06C1</div>';
    html += '<div>' + Math.round(mdata.bestScore * 100) + '% &mdash; ';
    for (var s = 0; s < 3; s++) {
      html += s < mdata.stars ? '\u2B50' : '\u2606';
    }
    html += ' &mdash; ' + mdata.attempts + ' \u06A9\u0648\u0634\u0634' + (mdata.attempts !== 1 ? '\u06CC\u06BA' : '') + '</div>';

  }

  // Launch buttons
  html += '<div class="campaign-brief-actions">';

    html += '<div class="campaign-brief-choices">';
    html += '<div class="campaign-brief-choice-label">\u0627\u067E\u0646\u06CC \u0688\u0631\u0644 \u0686\u0646\u06CC\u06BA:</div>';
    html += '<button class="campaign-launch-btn" onclick="launchMission(\'' + mission.id + '\',\'quick\')">\u0641\u0648\u0631\u06CC \u0688\u0631\u0644</button>';
    html += '<button class="campaign-launch-btn" onclick="launchMission(\'' + mission.id + '\',\'fullTable\')">\u0645\u06A9\u0645\u0644 \u062C\u062F\u0648\u0644</button>';
    html += '<button class="campaign-launch-btn" onclick="launchMission(\'' + mission.id + '\',\'tenseFocus\')">\u0632\u0645\u0627\u0646\u06C1 \u0641\u0648\u06A9\u0633</button>';
    html += '</div>';
  } else {
    html += '<button class="campaign-launch-btn campaign-launch-primary" onclick="launchMission(\'' + mission.id + '\',null)">\u0645\u0634\u0646 \u0634\u0631\u0648\u0639 \u06A9\u0631\u06CC\u06BA</button>';
  }

// ─── J) launchMission ───

var launchMission = function(missionId, drillChoice) {
  var mission = CAMPAIGN_MISSIONS_UR.find(function(m) { return m.id === missionId; });
  if (!mission) return;

  campaignMissionActive = { mission: mission, drillChoice: drillChoice, startTime: Date.now() };

  // Switch to practice tab
  switchConjTab('practice');

  // Get verb objects and tense keys scoped to mission
  var verbPool = getCampaignVerbPool(mission);
  var tensePool = getCampaignTensePool(mission);

  switch (mission.type) {
    case 'standard':
      if (drillChoice === 'fullTable') {
        var rv = verbPool[Math.floor(Math.random() * verbPool.length)];
        var rt = tensePool[Math.floor(Math.random() * tensePool.length)];
        startFullTableDrill(rv.inf, rt);
      } else if (drillChoice === 'tenseFocus') {
        startCampaignQuickDrill(verbPool, tensePool, mission.questionCount || 10);
      } else {
        startCampaignQuickDrill(verbPool, tensePool, mission.questionCount || 10);
      }
      break;
    case 'speed':
      startCampaignSpeedRound(verbPool, tensePool, mission.speedTarget || 10);
      break;
    case 'endurance':
      startCampaignQuickDrill(verbPool, tensePool, mission.questionCount || 20);
      break;
    case 'table':
      var rv2 = verbPool[Math.floor(Math.random() * verbPool.length)];
      var rt2 = tensePool[Math.floor(Math.random() * tensePool.length)];
      startFullTableDrill(rv2.inf, rt2);
      break;
    case 'boss':
      // Boss missions: large quick drill with all mission verbs/tenses
      startCampaignQuickDrill(verbPool, tensePool, mission.questionCount || 20);
      break;
    case 'gauntlet':
      startCampaignGauntlet(mission);
      break;
  }
};

// ─── L) startCampaignQuickDrill ───

var startCampaignQuickDrill = function(verbPool, tensePool, count) {
  if (!verbPool || verbPool.length === 0) verbPool = VERB_DATA_UR;
  if (!tensePool || tensePool.length === 0) tensePool = Object.keys(TENSE_LABELS_UR);
  if (!count) count = 10;

  var questions = [];
  var attempts = 0;
  while (questions.length < count && attempts < count * 10) {
    attempts++;
    var verb = verbPool[Math.floor(Math.random() * verbPool.length)];
    var tense = tensePool[Math.floor(Math.random() * tensePool.length)];
    var personIdx = Math.floor(Math.random() * 6);
    // Random gender per question
    var gender = Math.random() < 0.5 ? 'm' : 'f';
    var forms = getVerbTense_UR(verb, tense, gender);
    var romanForms = getVerbTenseRoman_UR(verb, tense, gender);
    if (!forms) continue;
    var answer = forms[personIdx];
    if (!answer || answer === '-') continue;
    var romanAnswer = romanForms ? romanForms[personIdx] : '';
    questions.push({
      verb: verb,
      tenseKey: tense,
      tenseName: TENSE_LABELS_UR[tense],
      personIdx: personIdx,
      person: PERSONS_UR[personIdx],
      gender: gender,
      correctAnswer: answer,
      correctRoman: romanAnswer,
      userAnswer: null,
      correct: null,
      attempts: 0
    });
  }

  if (questions.length === 0) {
    showNotification('\u26A0\uFE0F \u062E\u0631\u0627\u0628\u06CC', '\u0627\u0633 \u0645\u0634\u0646 \u06A9\u06D2 \u0644\u06CC\u06D2 \u0633\u0648\u0627\u0644\u0627\u062A \u0646\u06C1\u06CC\u06BA \u0628\u0646 \u0633\u06A9\u06D2\u06D4', 'info');
    campaignMissionActive = null;
    return;
  }

  drillState = {
    type: 'quick',
    difficulty: 'campaign',
    questions: questions,
    currentIdx: 0,
    startTime: Date.now(),
    streak: 0,
    score: 0
  };
  renderDrillQuestion();
};

// ─── M) startCampaignSpeedRound ───

var startCampaignSpeedRound = function(verbPool, tensePool, target) {
  if (speedRoundTimer) { clearInterval(speedRoundTimer); speedRoundTimer = null; }
  if (!verbPool || verbPool.length === 0) verbPool = VERB_DATA_UR;
  if (!tensePool || tensePool.length === 0) tensePool = Object.keys(TENSE_LABELS_UR);

  drillState = {
    type: 'speedRound',
    timeLeft: 60,
    totalAnswered: 0,
    totalCorrect: 0,
    startTime: Date.now(),
    currentQuestion: null,
    results: [],
    campaignVerbPool: verbPool,
    campaignTensePool: tensePool
  };

  // Generate first question from restricted pool
  generateCampaignSpeedQuestion_UR(verbPool, tensePool);
  renderSpeedQuestion();

  speedRoundTimer = setInterval(function() {
    if (!drillState || drillState.type !== 'speedRound') {
      clearInterval(speedRoundTimer);
      speedRoundTimer = null;
      return;
    }
    drillState.timeLeft--;
    var timerEl = document.getElementById('speedTimer');
    if (timerEl) {
      timerEl.textContent = drillState.timeLeft + 's';
      if (drillState.timeLeft <= 10) timerEl.style.color = '#e74c3c';
    }
    if (drillState.timeLeft <= 0) {
      endSpeedRound();
    }
  }, 1000);
};

// Helper: generate a single speed question from campaign-restricted pools
var generateCampaignSpeedQuestion_UR = function(verbPool, tensePool) {
  if (!drillState) return;
  var verb, tense, personIdx, gender, forms, romanForms, answer;
  var attempts = 0;
  do {
    attempts++;
    verb = verbPool[Math.floor(Math.random() * verbPool.length)];
    tense = tensePool[Math.floor(Math.random() * tensePool.length)];
    personIdx = Math.floor(Math.random() * 6);
    gender = Math.random() < 0.5 ? 'm' : 'f';
    forms = getVerbTense_UR(verb, tense, gender);
    romanForms = getVerbTenseRoman_UR(verb, tense, gender);
    answer = forms ? forms[personIdx] : null;
  } while ((!answer || answer === '-') && attempts < 50);

  var romanAnswer = romanForms ? romanForms[personIdx] : '';

  drillState.currentQuestion = {
    verb: verb,
    tenseKey: tense,
    tenseName: TENSE_LABELS_UR[tense],
    personIdx: personIdx,
    person: PERSONS_UR[personIdx],
    gender: gender,
    correctAnswer: answer || '???',
    correctRoman: romanAnswer || ''
  };
};

// ─── N) startCampaignGauntlet ───

var startCampaignGauntlet = function(mission) {
  var verbPool = getCampaignVerbPool(mission);
  var tensePool = getCampaignTensePool(mission);
  if (!verbPool || verbPool.length === 0) verbPool = VERB_DATA_UR;
  if (!tensePool || tensePool.length === 0) tensePool = Object.keys(TENSE_LABELS_UR);

  var count = mission.questionCount || 30;
  var questions = [];
  var attempts = 0;

  // Gauntlet: cycle through all verbs x all tenses, random person, random gender
  verbPool.forEach(function(verb) {
    tensePool.forEach(function(tense) {
      var gender = Math.random() < 0.5 ? 'm' : 'f';
      var personIdx = Math.floor(Math.random() * 6);
      var forms = getVerbTense_UR(verb, tense, gender);
      var romanForms = getVerbTenseRoman_UR(verb, tense, gender);
      if (!forms) return;
      var answer = forms[personIdx];
      // Retry different persons if we hit '-'
      var retries = 0;
      while ((!answer || answer === '-') && retries < 6) {
        personIdx = (personIdx + 1) % 6;
        answer = forms[personIdx];
        retries++;
      }
      if (answer && answer !== '-') {
        var romanAnswer = romanForms ? romanForms[personIdx] : '';
        questions.push({
          verb: verb,
          tenseKey: tense,
          tenseName: TENSE_LABELS_UR[tense],
          personIdx: personIdx,
          person: PERSONS_UR[personIdx],
          gender: gender,
          correctAnswer: answer,
          correctRoman: romanAnswer,
          userAnswer: null,
          correct: null,
          attempts: 0
        });
      }
    });
  });

  // Shuffle and limit to count
  for (var i = questions.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = questions[i];
    questions[i] = questions[j];
    questions[j] = tmp;
  }
  if (questions.length > count) {
    questions = questions.slice(0, count);
  }

  if (questions.length === 0) {
    showNotification('\u26A0\uFE0F \u062E\u0631\u0627\u0628\u06CC', '\u06AF\u0627\u0646\u0679\u0644\u0679 \u06A9\u06D2 \u0644\u06CC\u06D2 \u0633\u0648\u0627\u0644\u0627\u062A \u0646\u06C1\u06CC\u06BA \u0628\u0646 \u0633\u06A9\u06D2\u06D4', 'info');
    campaignMissionActive = null;
    return;
  }

  drillState = {
    type: 'quick',
    difficulty: 'gauntlet',
    questions: questions,
    currentIdx: 0,
    startTime: Date.now(),
    streak: 0,
    score: 0
  };
  renderDrillQuestion();
};

// ─── K) processCampaignResult ───

var processCampaignResult = function(missionId, score, total) {
  if (!campaignMissionActive) return;
  var mission = campaignMissionActive.mission;
  if (!mission) { campaignMissionActive = null; return; }
  if (!conjProgress) initConjProgress();
  if (!conjProgress.campaign) conjProgress.campaign = { missions: {}, totalStars: 0, completedCount: 0, currentChapter: 1 };
  var cp = conjProgress.campaign;

  // Calculate score ratio
  var scoreRatio = total > 0 ? score / total : 0;

  // Calculate stars
  var stars = 0;
  if (scoreRatio >= mission.starThresholds[2]) stars = 3;
  else if (scoreRatio >= mission.starThresholds[1]) stars = 2;
  else if (scoreRatio >= mission.starThresholds[0]) stars = 1;

  var passed = scoreRatio >= mission.passThreshold;
  var prev = cp.missions[mission.id] || { completed: false, bestScore: 0, stars: 0, attempts: 0 };
  prev.attempts++;

  if (passed) {
    var improved = prev.completed && (stars > prev.stars || scoreRatio > prev.bestScore);
    if (!prev.completed) {
      prev.completed = true;
      cp.completedCount++;
      // Award bonus XP
      if (mission.xpBonus) addXP(mission.xpBonus);
    }
    // Update best
    if (scoreRatio > prev.bestScore) prev.bestScore = scoreRatio;
    if (stars > prev.stars) {
      cp.totalStars += (stars - prev.stars);
      prev.stars = stars;
    }
    // Update current chapter: unlock next chapter if all non-side missions in current are done
    var maxChapter = 1;
    for (var mid in cp.missions) {
      if (cp.missions[mid].completed) {
        var ch = parseInt(mid.split('-')[0]);
        if (ch >= maxChapter) maxChapter = ch;
      }
    }
    cp.currentChapter = Math.min(maxChapter + 1, CAMPAIGN_CHAPTERS_UR.length);

    if (improved) {
      showNotification('\u2B06\uFE0F \u0628\u06C1\u062A\u0631\u06CC!', mission.title + ': ' + Math.round(scoreRatio * 100) + '% (' + stars + ' \u0633\u062A\u0627\u0631\u06D2)', 'badge');
    } else {
      showNotification('\u2705 \u0645\u0634\u0646 \u0645\u06A9\u0645\u0644!', mission.title + ': ' + Math.round(scoreRatio * 100) + '% (' + stars + ' \u0633\u062A\u0627\u0631\u06D2)', 'badge');
    }
  } else {
    showNotification('\u274C \u0645\u0634\u0646 \u0646\u0627\u06A9\u0627\u0645', mission.title + ': ' + Math.round(scoreRatio * 100) + '% (\u0636\u0631\u0648\u0631\u062A ' + Math.round(mission.passThreshold * 100) + '%)', 'info');
  }

  cp.missions[mission.id] = prev;
  saveConjProgress();
  checkBadges();

  // Add "Return to Campaign" button to drill area
  var area = document.getElementById('drillArea');
  if (area) {
    var returnBtn = document.createElement('div');
    returnBtn.style.cssText = 'text-align:center;margin-top:16px;';
    returnBtn.innerHTML = '<button class="drill-action-btn" style="background:#f39c12;color:#000;font-weight:700;" onclick="switchConjTab(\'campaign\')">\u0645\u06C1\u0645 \u067E\u0631 \u0648\u0627\u067E\u0633</button>';
    area.appendChild(returnBtn);
  }
  campaignMissionActive = null;
};

var initConjProgress = loadConjProgress;

</script>
